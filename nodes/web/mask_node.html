<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mask Drawing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0d;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #imageContainer {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px;
        }
        #baseImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            user-select: none;
            pointer-events: none;
            border-radius: 12px;
        }
        #drawCanvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: none;
            touch-action: none;
        }

        /* iOS frosted glass status */
        #status {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            background: rgba(28, 28, 30, 0.55);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 8px 20px;
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            z-index: 50;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
            letter-spacing: 0.2px;
            transition: all 0.3s ease;
        }
        #status.success {
            background: rgba(48, 209, 88, 0.2);
            border-color: rgba(48, 209, 88, 0.3);
            color: #30d158;
        }

        /* Bottom bar */
        .bottom-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 10px 20px;
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-top: 1px solid rgba(255,255,255,0.06);
            z-index: 50;
        }
        .bottom-bar .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bottom-bar label {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
        }
        .bottom-bar input[type="range"] {
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
            width: 100px;
        }
        .bottom-bar input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            margin-top: -6px;
        }
        .bottom-bar input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
        }
        .bottom-bar .range-value {
            min-width: 28px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
        .confirm-btn {
            padding: 10px 32px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            background: rgba(48, 209, 88, 0.9);
        }
        .confirm-btn:hover {
            background: rgba(48, 209, 88, 1.0);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(48, 209, 88, 0.35);
        }
        .confirm-btn.update {
            background: rgba(0, 122, 255, 0.9);
        }
        .confirm-btn.update:hover {
            background: rgba(0, 122, 255, 1.0);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.35);
        }

        /* Detector panel (top-right) */
        .controls {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            padding: 14px;
            border-radius: 20px;
            z-index: 50;
            display: none;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .controls.visible {
            display: flex;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 500;
        }
        .control-row label {
            min-width: 50px;
            font-weight: 500;
        }
        .control-row input[type="range"] {
            flex: 1;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
        }
        .control-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            margin-top: -6px;
        }
        .control-row input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
        }
        .control-row span {
            min-width: 28px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
        .control-row input[type="text"] {
            flex: 1;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 5px 10px;
            color: #fff;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        .control-row input[type="text"]:focus {
            border-color: rgba(0, 122, 255, 0.5);
        }
        .control-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #007aff;
        }
        .detector-title {
            font-size: 11px;
            font-weight: 700;
            color: #64d2ff;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* Modern buttons */
        .control-button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 10px;
            padding: 7px 14px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
        }
        .control-button:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }
        .control-button:active {
            transform: translateY(0);
        }
        .control-button.primary {
            background: rgba(0, 122, 255, 0.85);
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.25);
        }
        .control-button.primary:hover {
            background: rgba(0, 122, 255, 1.0);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.35);
        }
        .control-button.warning {
            background: rgba(255, 159, 10, 0.85);
            box-shadow: 0 2px 8px rgba(255, 159, 10, 0.2);
        }
        .control-button.warning:hover {
            background: rgba(255, 159, 10, 1.0);
            box-shadow: 0 4px 12px rgba(255, 159, 10, 0.3);
        }

        /* Brush cursor — circle + crosshair */
        #brushCursor {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 100;
            display: none;
            transform: translate(-50%, -50%);
            box-sizing: border-box;
        }
        #brushCursor.draw {
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(0, 0, 0, 0.3);
        }
        #brushCursor.erase {
            border: 1.5px dashed rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
        }
        /* Crosshair lines inside the brush circle */
        #brushCursor::before,
        #brushCursor::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.5);
        }
        #brushCursor::before {
            width: 1px;
            height: 16px;
        }
        #brushCursor::after {
            width: 16px;
            height: 1px;
        }

        /* Divider in bottom bar */
        .bottom-divider {
            width: 1px;
            height: 28px;
            background: rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="imageContainer">
        <img id="baseImage" src="" alt="Image">
        <canvas id="drawCanvas"></canvas>
        <div id="brushCursor"></div>
        <div id="status">Loading...</div>

        <!-- Detector panel (top-right, only shown if detector exists) -->
        <div class="controls" id="detectorPanel">
            <div class="detector-title">Detector</div>
            <div class="control-row">
                <label>Thresh</label>
                <input type="range" id="detThreshold" min="0" max="1" step="0.01" value="0.5">
                <span id="detThresholdValue">0.50</span>
            </div>
            <div class="control-row">
                <label>Dilate</label>
                <input type="range" id="detDilation" min="0" max="64" step="1" value="4">
                <span id="detDilationValue">4</span>
            </div>
            <div class="control-row">
                <label>Crop</label>
                <input type="range" id="detCropFactor" min="1" max="4" step="0.1" value="1.5">
                <span id="detCropFactorValue">1.5</span>
            </div>
            <div class="control-row">
                <label>Drop</label>
                <input type="range" id="detDropSize" min="0" max="512" step="1" value="0">
                <span id="detDropSizeValue">0</span>
            </div>
            <div class="control-row">
                <label>Prompt</label>
                <input type="text" id="detPrompt" placeholder="empty">
            </div>
            <div class="control-row">
                <label>Fill</label>
                <input type="checkbox" id="detFillMask" checked>
            </div>
            <div class="control-row" style="justify-content: center;">
                <button class="control-button primary" id="detectButton">Detect</button>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <!-- Grow slider -->
        <div class="control-group">
            <label>Grow</label>
            <input type="range" id="growSize" min="0" max="50" step="1" value="4">
            <span class="range-value" id="growSizeValue">4</span>
        </div>
        <!-- Grow button -->
        <button class="control-button warning" id="growButton">Grow</button>
        <div class="bottom-divider"></div>
        <!-- Size slider -->
        <div class="control-group">
            <label>Size</label>
            <input type="range" id="brushSize" min="2" max="9999" value="20">
            <span class="range-value" id="brushSizeValue">20</span>
        </div>
        <!-- Full button -->
        <button class="control-button" id="fullButton">Full</button>
        <!-- Clear button -->
        <button class="control-button" id="clearButton">Clear</button>
        <div class="bottom-divider"></div>
        <!-- Confirm -->
        <button class="confirm-btn" id="confirmButton">Confirm Mask</button>
    </div>

    <script>
        const imageContainer = document.getElementById('imageContainer');
        const baseImage = document.getElementById('baseImage');
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const brushSizeInput = document.getElementById('brushSize');
        const brushSizeValue = document.getElementById('brushSizeValue');
        const brushCursor = document.getElementById('brushCursor');
        const detectorPanel = document.getElementById('detectorPanel');
        const confirmButton = document.getElementById('confirmButton');

        let isDrawing = false;
        let brushSize = 20;
        let isErasing = false;
        let lastX = 0;
        let lastY = 0;
        let isOverImageArea = false;
        let hasDetector = false;
        let isAltResizing = false;
        let altResizeAnchorX = 0;
        let altResizeAnchorSize = 20;
        let altResizeBrushCenterX = 0;
        let altResizeBrushCenterY = 0;
        const ALT_RESIZE_SENSITIVITY = 0.5;
        let maskConfirmed = false;
        let currentLoop = '0';

        async function loadImage() {
            try {
                const response = await fetch('/image_data', { cache: 'no-store' });
                const data = await response.json();

                const handleImageLoaded = () => {
                    setTimeout(() => {
                        fitCanvas();
                        if (data.initial_mask) {
                            const maskImg = new Image();
                            maskImg.onload = () => {
                                ctx.globalCompositeOperation = 'source-over';
                                ctx.drawImage(maskImg, 0, 0, canvas.width, canvas.height);
                            };
                            maskImg.src = data.initial_mask;
                        }
                        if (data.has_detector) {
                            hasDetector = true;
                            detectorPanel.classList.add('visible');
                        }
                        status.textContent = 'Ready';
                    }, 0);
                };

                if (baseImage.getAttribute('src') === data.image) {
                    handleImageLoaded();
                } else {
                    baseImage.onload = handleImageLoaded;
                    baseImage.src = data.image;
                }
            } catch (error) {
                console.error('Error loading image:', error);
                status.textContent = 'Error loading image';
            }
        }

        function fitCanvas() {
            const rect = baseImage.getBoundingClientRect();
            const containerRect = imageContainer.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) {
                setTimeout(fitCanvas, 50);
                return;
            }
            canvas.style.left = (rect.left - containerRect.left) + 'px';
            canvas.style.top = (rect.top - containerRect.top) + 'px';
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function updateCursorSize() {
            brushCursor.style.width = brushSize + 'px';
            brushCursor.style.height = brushSize + 'px';
        }
        function updateCursorMode() {
            if (isErasing) {
                brushCursor.classList.remove('draw');
                brushCursor.classList.add('erase');
            } else {
                brushCursor.classList.remove('erase');
                brushCursor.classList.add('draw');
            }
        }
        function moveCursor(e) {
            brushCursor.style.left = e.clientX + 'px';
            brushCursor.style.top = e.clientY + 'px';
        }

        function drawDot(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
            if (isErasing) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.fillStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = 'rgba(255, 0, 0, 0.6)';
            }
            ctx.fill();
        }

        function drawStroke(x, y) {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = brushSize;
            if (isErasing) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.6)';
            }
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            drawDot(x, y);
        }

        // --- Mouse events on imageContainer (not just canvas) ---
        // This ensures Alt+Drag resize continues even if the mouse leaves the canvas
        // but stays within the container.
        imageContainer.addEventListener('mouseenter', () => {
            isOverImageArea = true;
            brushCursor.style.display = 'block';
        });
        imageContainer.addEventListener('mouseleave', () => {
            isOverImageArea = false;
            // Only hide cursor and stop drawing if NOT in Alt+Drag resize mode
            if (!isAltResizing) {
                brushCursor.style.display = 'none';
                isDrawing = false;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isAltResizing) {
                // PS-style: keep brush center fixed at the position where Alt+Drag started.
                const dx = e.clientX - altResizeAnchorX;
                const newSize = altResizeAnchorSize + dx * ALT_RESIZE_SENSITIVITY;
                brushSize = Math.max(2, Math.round(newSize));
                brushSizeInput.value = brushSize;
                brushSizeValue.textContent = brushSize;
                updateCursorSize();
                // Keep cursor at the anchored center
                brushCursor.style.left = altResizeBrushCenterX + 'px';
                brushCursor.style.top = altResizeBrushCenterY + 'px';
                return;
            }
            moveCursor(e);
            if (!isDrawing) return;
            const pos = getCanvasPos(e);
            drawStroke(pos.x, pos.y);
            lastX = pos.x;
            lastY = pos.y;
        });

        // Mouse down on canvas — start drawing or Alt+Drag resize
        canvas.addEventListener('mousedown', (e) => {
            if (e.altKey) {
                isAltResizing = true;
                altResizeAnchorX = e.clientX;
                altResizeAnchorSize = brushSize;
                altResizeBrushCenterX = e.clientX;
                altResizeBrushCenterY = e.clientY;
                e.preventDefault();
                return;
            }
            if (e.button === 0) { isErasing = false; isDrawing = true; }
            else if (e.button === 2) { isErasing = true; isDrawing = true; }
            else { return; }
            updateCursorMode();
            const pos = getCanvasPos(e);
            lastX = pos.x;
            lastY = pos.y;
            drawDot(lastX, lastY);
            e.preventDefault();
        });
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('mouseup', (e) => {
            isDrawing = false;
            if (isAltResizing) {
                isAltResizing = false;
                moveCursor(e);
            }
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 2 : -2;
            let newSize = brushSize + delta;
            newSize = Math.max(2, newSize);
            brushSize = newSize;
            brushSizeInput.value = brushSize;
            brushSizeValue.textContent = brushSize;
            updateCursorSize();
        }, { passive: false });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length !== 1) return;
            isDrawing = true;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            lastX = touch.clientX - rect.left;
            lastY = touch.clientY - rect.top;
            drawDot(lastX, lastY);
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDrawing || e.touches.length !== 1) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            drawStroke(x, y);
            lastX = x;
            lastY = y;
        }, { passive: false });
        canvas.addEventListener('touchend', () => { isDrawing = false; });

        // Brush size slider
        brushSizeInput.addEventListener('input', (e) => {
            brushSize = parseInt(e.target.value);
            brushSizeValue.textContent = brushSize;
            updateCursorSize();
        });

        // Clear
        document.getElementById('clearButton').addEventListener('click', async () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            try {
                await fetch('/clear', { method: 'POST' });
            } catch (err) {
                console.error('Clear failed:', err);
            }
        });

        // Full - fill entire canvas with mask
        document.getElementById('fullButton').addEventListener('click', () => {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(255, 0, 0, 0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            status.textContent = 'Full mask applied';
            status.classList.add('success');
        });

        // Grow size slider
        const growSizeInput = document.getElementById('growSize');
        const growSizeValue = document.getElementById('growSizeValue');
        growSizeInput.addEventListener('input', (e) => {
            growSizeValue.textContent = e.target.value;
        });

        // Grow button
        document.getElementById('growButton').addEventListener('click', async () => {
            const grow = parseInt(growSizeInput.value);
            if (grow <= 0) return;
            status.textContent = 'Growing mask...';
            status.classList.remove('success');
            try {
                const maskBase64 = canvas.toDataURL('image/png');
                const response = await fetch('/grow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mask: maskBase64, grow: grow })
                });
                const result = await response.json();
                if (response.ok && result.mask) {
                    const maskImg = new Image();
                    maskImg.onload = () => {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.drawImage(maskImg, 0, 0, canvas.width, canvas.height);
                        status.textContent = 'Mask grown';
                    };
                    maskImg.src = result.mask;
                } else {
                    status.textContent = 'Grow error: ' + (result.error || 'unknown');
                }
            } catch (err) {
                console.error(err);
                status.textContent = 'Grow failed';
            }
        });

        // Detector params live update labels
        function bindRange(id, valId) {
            const el = document.getElementById(id);
            const valEl = document.getElementById(valId);
            if (!el || !valEl) return;
            el.addEventListener('input', () => { valEl.textContent = el.value; });
        }
        bindRange('detThreshold', 'detThresholdValue');
        bindRange('detDilation', 'detDilationValue');
        bindRange('detCropFactor', 'detCropFactorValue');
        bindRange('detDropSize', 'detDropSizeValue');

        // Detect button
        document.getElementById('detectButton').addEventListener('click', async () => {
            if (!hasDetector) return;
            status.textContent = 'Detecting...';
            status.classList.remove('success');
            try {
                const params = {
                    threshold: parseFloat(document.getElementById('detThreshold').value),
                    dilation: parseInt(document.getElementById('detDilation').value),
                    crop_factor: parseFloat(document.getElementById('detCropFactor').value),
                    drop_size: parseInt(document.getElementById('detDropSize').value),
                    prompt: document.getElementById('detPrompt').value,
                    fill_mask: document.getElementById('detFillMask').checked,
                };
                const response = await fetch('/detect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params)
                });
                const result = await response.json();
                if (response.ok && result.mask) {
                    const maskImg = new Image();
                    maskImg.onload = () => {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.drawImage(maskImg, 0, 0, canvas.width, canvas.height);
                        status.textContent = 'Detection applied';
                    };
                    maskImg.src = result.mask;
                } else if (response.ok) {
                    status.textContent = result.message || 'No objects detected';
                } else {
                    status.textContent = 'Detect error: ' + (result.error || 'unknown');
                }
            } catch (err) {
                console.error(err);
                status.textContent = 'Detect failed';
            }
        });

        // Send mask (Confirm / Update)
        async function sendMask() {
            try {
                const base64 = canvas.toDataURL('image/png');
                const response = await fetch('/mask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mask: base64, loop: currentLoop })
                });
                if (response.ok) {
                    const wasConfirmed = maskConfirmed;
                    maskConfirmed = true;
                    status.textContent = wasConfirmed ? 'Mask updated' : 'Mask confirmed';
                    status.classList.add('success');
                    confirmButton.textContent = 'Update Mask';
                    confirmButton.classList.add('update');
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'mask-confirmed' }, '*');
                    }
                    setTimeout(() => {
                        window.close();
                    }, 300);
                } else {
                    status.textContent = 'Error sending mask';
                    status.classList.remove('success');
                }
            } catch (error) {
                console.error('Error sending mask:', error);
                status.textContent = 'Error sending mask';
                status.classList.remove('success');
            }
        }

        confirmButton.addEventListener('click', sendMask);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMask();
        });

        // Listen for messages from parent window
        window.addEventListener('message', (event) => {
            if (event.data?.type === 'get-mask') {
                const base64 = canvas.toDataURL('image/png');
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'mask-data', mask: base64 }, '*');
                }
            } else if (event.data?.type === 'new-loop' || event.data?.type === 'reload-image') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                maskConfirmed = false;
                confirmButton.textContent = 'Confirm Mask';
                confirmButton.classList.remove('update');
                status.textContent = 'Loading...';
                status.classList.remove('success');
                loadImage();
            }
        });

        window.addEventListener('beforeunload', async () => {
            try {
                await fetch('/window_closed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ closed: true })
                });
            } catch (error) {
                console.error('Error notifying window close:', error);
            }
        });

        window.addEventListener('resize', () => {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(canvas, 0, 0);
            fitCanvas();
            ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
        });

        function initOnLoad() {
            loadImage();
            updateCursorSize();
            updateCursorMode();
        }
        if (document.readyState === 'complete') {
            initOnLoad();
        } else {
            window.addEventListener('load', initOnLoad);
        }
    </script>
</body>
</html>
