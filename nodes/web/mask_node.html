<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mask Drawing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1a;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #imageContainer {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px;
        }
        #baseImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            user-select: none;
            pointer-events: none;
        }
        #drawCanvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: none;
            touch-action: none;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
            text-align: center;
            z-index: 50;
        }
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
            text-align: center;
            z-index: 50;
        }
        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 6px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 160px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 12px;
        }
        .control-row label {
            min-width: 40px;
        }
        .control-row input[type="range"] {
            flex: 1;
            cursor: pointer;
        }
        .control-row span {
            min-width: 28px;
            text-align: right;
        }
        .control-button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .control-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .control-button.primary {
            background: rgba(0, 122, 255, 0.8);
        }
        .control-button.primary:hover {
            background: rgba(0, 122, 255, 1.0);
        }
        .control-button.warning {
            background: rgba(255, 165, 0, 0.8);
        }
        .control-button.warning:hover {
            background: rgba(255, 165, 0, 1.0);
        }
        .mode-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .mode-badge.draw { background: rgba(255, 0, 0, 0.6); color: #fff; }
        .mode-badge.erase { background: rgba(255, 255, 255, 0.3); color: #fff; }
        #brushCursor {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 100;
            display: none;
            transform: translate(-50%, -50%);
            box-sizing: border-box;
        }
        #brushCursor.draw {
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(0, 0, 0, 0.3);
        }
        #brushCursor.erase {
            border: 1.5px dashed rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
        }
        .detector-section {
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 8px;
            margin-top: 4px;
            display: none;
        }
        .detector-section.visible {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .detector-title {
            font-size: 11px;
            font-weight: 600;
            color: #7ec8e3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .control-row input[type="text"] {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 3px;
            padding: 3px 6px;
            color: #fff;
            font-size: 11px;
        }
        .control-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="imageContainer">
        <img id="baseImage" src="" alt="Image">
        <canvas id="drawCanvas"></canvas>
        <div id="brushCursor"></div>
        <div id="status">Loading...</div>
        <div class="instructions">
            <strong>LMB</strong> Draw · <strong>RMB</strong> Erase · <strong>Wheel</strong> Size · <strong>Alt+Drag</strong> Resize · <strong>Enter</strong> Confirm
        </div>
        <div class="controls">
            <div class="control-row" style="justify-content: space-between;">
                <span>Mode</span>
                <span class="mode-badge draw" id="modeBadge">Draw</span>
            </div>
            <div class="control-row">
                <label>Size</label>
                <input type="range" id="brushSize" min="2" max="200" value="20">
                <span id="brushSizeValue">20</span>
            </div>
            <div class="control-row" style="justify-content: center; gap: 6px;">
                <button class="control-button" id="clearButton">Clear</button>
                <button class="control-button warning" id="growButton">Grow</button>
            </div>
            <div class="control-row">
                <label style="min-width:50px;">Grow</label>
                <input type="range" id="growSize" min="0" max="50" step="1" value="4">
                <span id="growSizeValue">4</span>
            </div>

            <!-- Detector panel -->
            <div class="detector-section" id="detectorSection">
                <div class="detector-title">Detector</div>
                <div class="control-row">
                    <label style="min-width:50px;">Thresh</label>
                    <input type="range" id="detThreshold" min="0" max="1" step="0.01" value="0.5">
                    <span id="detThresholdValue">0.50</span>
                </div>
                <div class="control-row">
                    <label style="min-width:50px;">Dilate</label>
                    <input type="range" id="detDilation" min="0" max="64" step="1" value="4">
                    <span id="detDilationValue">4</span>
                </div>
                <div class="control-row">
                    <label style="min-width:50px;">Crop</label>
                    <input type="range" id="detCropFactor" min="1" max="4" step="0.1" value="1.5">
                    <span id="detCropFactorValue">1.5</span>
                </div>
                <div class="control-row">
                    <label style="min-width:50px;">Drop</label>
                    <input type="range" id="detDropSize" min="0" max="512" step="1" value="0">
                    <span id="detDropSizeValue">0</span>
                </div>
                <div class="control-row">
                    <label style="min-width:50px;">Prompt</label>
                    <input type="text" id="detPrompt" placeholder="empty">
                </div>
                <div class="control-row">
                    <label style="min-width:50px;">Fill</label>
                    <input type="checkbox" id="detFillMask" checked>
                </div>
                <div class="control-row" style="justify-content: center;">
                    <button class="control-button primary" id="detectButton">Detect</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageContainer = document.getElementById('imageContainer');
        const baseImage = document.getElementById('baseImage');
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const brushSizeInput = document.getElementById('brushSize');
        const brushSizeValue = document.getElementById('brushSizeValue');
        const modeBadge = document.getElementById('modeBadge');
        const brushCursor = document.getElementById('brushCursor');
        const detectorSection = document.getElementById('detectorSection');

        let isDrawing = false;
        let brushSize = 20;
        let isErasing = false;
        let lastX = 0;
        let lastY = 0;
        let isOverCanvas = false;
        let hasDetector = false;
        let isAltResizing = false;
        let altResizeOriginX = 0;
        let altResizeBaseSize = 20;
        const ALT_RESIZE_SENSITIVITY = 0.5;

        async function loadImage() {
            try {
                const response = await fetch('/image_data');
                const data = await response.json();
                baseImage.src = data.image;
                baseImage.onload = () => {
                    fitCanvas();
                    if (data.initial_mask) {
                        const maskImg = new Image();
                        maskImg.onload = () => {
                            ctx.drawImage(maskImg, 0, 0, canvas.width, canvas.height);
                        };
                        maskImg.src = data.initial_mask;
                    }
                    if (data.has_detector) {
                        hasDetector = true;
                        detectorSection.classList.add('visible');
                    }
                    status.textContent = 'Ready';
                };
            } catch (error) {
                console.error('Error loading image:', error);
                status.textContent = 'Error loading image';
            }
        }

        function fitCanvas() {
            const rect = baseImage.getBoundingClientRect();
            const containerRect = imageContainer.getBoundingClientRect();
            canvas.style.left = (rect.left - containerRect.left) + 'px';
            canvas.style.top = (rect.top - containerRect.top) + 'px';
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function updateCursorSize() {
            brushCursor.style.width = brushSize + 'px';
            brushCursor.style.height = brushSize + 'px';
        }
        function updateCursorMode() {
            if (isErasing) {
                brushCursor.classList.remove('draw');
                brushCursor.classList.add('erase');
                modeBadge.textContent = 'Erase';
                modeBadge.classList.remove('draw');
                modeBadge.classList.add('erase');
            } else {
                brushCursor.classList.remove('erase');
                brushCursor.classList.add('draw');
                modeBadge.textContent = 'Draw';
                modeBadge.classList.remove('erase');
                modeBadge.classList.add('draw');
            }
        }
        function moveCursor(e) {
            brushCursor.style.left = e.clientX + 'px';
            brushCursor.style.top = e.clientY + 'px';
        }

        function drawDot(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
            if (isErasing) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.fillStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = 'rgba(255, 0, 0, 0.6)';
            }
            ctx.fill();
        }

        function drawStroke(x, y) {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = brushSize;
            if (isErasing) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.6)';
            }
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            drawDot(x, y);
        }

        canvas.addEventListener('mouseenter', () => { isOverCanvas = true; brushCursor.style.display = 'block'; });
        canvas.addEventListener('mouseleave', () => { isOverCanvas = false; brushCursor.style.display = 'none'; isDrawing = false; });

        window.addEventListener('mousemove', (e) => {
            moveCursor(e);
            if (isAltResizing) {
                const dx = e.clientX - altResizeOriginX;
                const newSize = altResizeBaseSize + dx * ALT_RESIZE_SENSITIVITY;
                brushSize = Math.max(2, Math.min(200, Math.round(newSize)));
                brushSizeInput.value = brushSize;
                brushSizeValue.textContent = brushSize;
                updateCursorSize();
                return;
            }
            if (!isDrawing) return;
            const pos = getCanvasPos(e);
            drawStroke(pos.x, pos.y);
            lastX = pos.x;
            lastY = pos.y;
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.altKey) {
                isAltResizing = true;
                altResizeOriginX = e.clientX;
                altResizeBaseSize = brushSize;
                e.preventDefault();
                return;
            }
            if (e.button === 0) { isErasing = false; isDrawing = true; }
            else if (e.button === 2) { isErasing = true; isDrawing = true; }
            else { return; }
            updateCursorMode();
            const pos = getCanvasPos(e);
            lastX = pos.x;
            lastY = pos.y;
            drawDot(lastX, lastY);
            e.preventDefault();
        });
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('mouseup', () => { isDrawing = false; isAltResizing = false; });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 2 : -2;
            let newSize = brushSize + delta;
            newSize = Math.max(2, Math.min(200, newSize));
            brushSize = newSize;
            brushSizeInput.value = brushSize;
            brushSizeValue.textContent = brushSize;
            updateCursorSize();
        }, { passive: false });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length !== 1) return;
            isDrawing = true;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            lastX = touch.clientX - rect.left;
            lastY = touch.clientY - rect.top;
            drawDot(lastX, lastY);
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDrawing || e.touches.length !== 1) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            drawStroke(x, y);
            lastX = x;
            lastY = y;
        }, { passive: false });
        canvas.addEventListener('touchend', () => { isDrawing = false; });

        // Brush size slider
        brushSizeInput.addEventListener('input', (e) => {
            brushSize = parseInt(e.target.value);
            brushSizeValue.textContent = brushSize;
            updateCursorSize();
        });

        // Clear
        document.getElementById('clearButton').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // Grow size slider
        const growSizeInput = document.getElementById('growSize');
        const growSizeValue = document.getElementById('growSizeValue');
        growSizeInput.addEventListener('input', (e) => {
            growSizeValue.textContent = e.target.value;
        });

        // Grow button
        document.getElementById('growButton').addEventListener('click', async () => {
            const grow = parseInt(growSizeInput.value);
            if (grow <= 0) return;
            status.textContent = 'Growing mask...';
            try {
                const maskBase64 = canvas.toDataURL('image/png');
                const response = await fetch('/grow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mask: maskBase64, grow: grow })
                });
                const result = await response.json();
                if (response.ok && result.mask) {
                    const maskImg = new Image();
                    maskImg.onload = () => {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.drawImage(maskImg, 0, 0, canvas.width, canvas.height);
                        status.textContent = 'Mask grown';
                    };
                    maskImg.src = result.mask;
                } else {
                    status.textContent = 'Grow error: ' + (result.error || 'unknown');
                }
            } catch (err) {
                console.error(err);
                status.textContent = 'Grow failed';
            }
        });

        // Detector params live update labels
        function bindRange(id, valId) {
            const el = document.getElementById(id);
            const valEl = document.getElementById(valId);
            if (!el || !valEl) return;
            el.addEventListener('input', () => { valEl.textContent = el.value; });
        }
        bindRange('detThreshold', 'detThresholdValue');
        bindRange('detDilation', 'detDilationValue');
        bindRange('detCropFactor', 'detCropFactorValue');
        bindRange('detDropSize', 'detDropSizeValue');

        // Detect button
        document.getElementById('detectButton').addEventListener('click', async () => {
            if (!hasDetector) return;
            status.textContent = 'Detecting...';
            try {
                const params = {
                    threshold: parseFloat(document.getElementById('detThreshold').value),
                    dilation: parseInt(document.getElementById('detDilation').value),
                    crop_factor: parseFloat(document.getElementById('detCropFactor').value),
                    drop_size: parseInt(document.getElementById('detDropSize').value),
                    prompt: document.getElementById('detPrompt').value,
                    fill_mask: document.getElementById('detFillMask').checked,
                };
                const response = await fetch('/detect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params)
                });
                const result = await response.json();
                if (response.ok && result.mask) {
                    const maskImg = new Image();
                    maskImg.onload = () => {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.drawImage(maskImg, 0, 0, canvas.width, canvas.height);
                        status.textContent = 'Detection applied';
                    };
                    maskImg.src = result.mask;
                } else if (response.ok) {
                    status.textContent = result.message || 'No objects detected';
                } else {
                    status.textContent = 'Detect error: ' + (result.error || 'unknown');
                }
            } catch (err) {
                console.error(err);
                status.textContent = 'Detect failed';
            }
        });

        // Send mask
        async function sendMask() {
            try {
                const base64 = canvas.toDataURL('image/png');
                const response = await fetch('/mask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mask: base64 })
                });
                if (response.ok) {
                    status.textContent = 'Mask sent successfully';
                    setTimeout(() => window.close(), 500);
                } else {
                    status.textContent = 'Error sending mask';
                }
            } catch (error) {
                console.error('Error sending mask:', error);
                status.textContent = 'Error sending mask';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMask();
        });

        window.addEventListener('beforeunload', async () => {
            try {
                await fetch('/window_closed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ closed: true })
                });
            } catch (error) {
                console.error('Error notifying window close:', error);
            }
        });

        window.addEventListener('resize', () => {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(canvas, 0, 0);
            fitCanvas();
            ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
        });

        window.addEventListener('load', () => {
            loadImage();
            updateCursorSize();
            updateCursorMode();
        });
    </script>
</body>
</html>
