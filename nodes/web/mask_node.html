<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mask Drawing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0d;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #imageContainer {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px;
        }
        #baseImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            user-select: none;
            pointer-events: none;
            border-radius: 12px;
        }
        #drawCanvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: none;
            touch-action: none;
        }

        /* iOS frosted glass status */
        #status {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            background: rgba(28, 28, 30, 0.55);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 8px 20px;
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            z-index: 50;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
            letter-spacing: 0.2px;
            transition: all 0.3s ease;
        }
        #status.success {
            background: rgba(48, 209, 88, 0.2);
            border-color: rgba(48, 209, 88, 0.3);
            color: #30d158;
        }

        /* Bottom bar */
        .bottom-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 10px 20px;
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-top: 1px solid rgba(255,255,255,0.06);
            z-index: 50;
        }
        .bottom-bar .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bottom-bar label {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
        }
        .bottom-bar input[type="range"] {
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
            width: 100px;
        }
        .bottom-bar input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            margin-top: -6px;
        }
        .bottom-bar input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
        }
        .bottom-bar .range-value {
            min-width: 28px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
        .confirm-btn {
            padding: 10px 32px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            background: rgba(48, 209, 88, 0.9);
        }
        .confirm-btn:hover {
            background: rgba(48, 209, 88, 1.0);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(48, 209, 88, 0.35);
        }
        .confirm-btn.update {
            background: rgba(0, 122, 255, 0.9);
        }
        .confirm-btn.update:hover {
            background: rgba(0, 122, 255, 1.0);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.35);
        }

        /* Right-side panel stack — panels stack vertically, never overlap */
        #rightPanels {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: calc(100% - 32px);
            z-index: 50;
        }
        /* Detector panel */
        .controls {
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            padding: 14px;
            border-radius: 20px;
            display: none;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
            min-height: 0;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .controls.visible {
            display: flex;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 500;
        }
        .control-row label {
            min-width: 50px;
            font-weight: 500;
        }
        .control-row input[type="range"] {
            flex: 1;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
        }
        .control-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            margin-top: -6px;
        }
        .control-row input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
        }
        .control-row span {
            min-width: 28px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
        .control-row input[type="text"] {
            flex: 1;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 5px 10px;
            color: #fff;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        .control-row input[type="text"]:focus {
            border-color: rgba(0, 122, 255, 0.5);
        }
        .control-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #007aff;
        }
        .detector-title {
            font-size: 11px;
            font-weight: 700;
            color: #64d2ff;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .brush-mode-btn.active, .eraser-mode-btn.active {
            background: rgba(0, 122, 255, 0.85);
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.25);
        }
        /* Brush panel (always visible) */
        .brush-panel {
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            padding: 14px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
            min-height: 0;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        /* Modern buttons */
        .control-button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 10px;
            padding: 7px 14px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
        }
        .control-button:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }
        .control-button:active {
            transform: translateY(0);
        }
        .control-button.primary {
            background: rgba(0, 122, 255, 0.85);
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.25);
        }
        .control-button.primary:hover {
            background: rgba(0, 122, 255, 1.0);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.35);
        }
        .control-button.warning {
            background: rgba(255, 159, 10, 0.85);
            box-shadow: 0 2px 8px rgba(255, 159, 10, 0.2);
        }
        .control-button.warning:hover {
            background: rgba(255, 159, 10, 1.0);
            box-shadow: 0 4px 12px rgba(255, 159, 10, 0.3);
        }

        /* Brush cursor — circle + crosshair */
        #brushCursor {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 100;
            display: none;
            transform: translate(-50%, -50%);
            box-sizing: border-box;
        }
        #brushCursor.draw {
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(0, 0, 0, 0.3);
        }
        #brushCursor.erase {
            border: 1.5px dashed rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
        }
        /* Crosshair lines inside the brush circle */
        #brushCursor::before,
        #brushCursor::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.5);
        }
        #brushCursor::before {
            width: 1px;
            height: 16px;
        }
        #brushCursor::after {
            width: 16px;
            height: 1px;
        }

        /* Divider in bottom bar */
        .bottom-divider {
            width: 1px;
            height: 28px;
            background: rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="imageContainer">
        <img id="baseImage" src="" alt="Image">
        <canvas id="drawCanvas"></canvas>
        <div id="brushCursor"></div>
        <div id="status">Loading...</div>

        <!-- Right-side panel stack (detector + brush, never overlap) -->
        <div id="rightPanels">
        <!-- Detector panel (top of stack, only shown if detector exists) -->
        <div class="controls" id="detectorPanel">
            <div class="detector-title">Detector</div>
            <div class="control-row">
                <label>Thresh</label>
                <input type="range" id="detThreshold" min="0" max="1" step="0.01" value="0.5">
                <span id="detThresholdValue">0.50</span>
            </div>
            <div class="control-row">
                <label>Strength</label>
                <input type="range" id="detStrength" min="0" max="1" step="0.01" value="1.0">
                <span id="detStrengthValue">1.00</span>
            </div>
            <div class="control-row">
                <label>Dilate</label>
                <input type="range" id="detDilation" min="0" max="64" step="1" value="4">
                <span id="detDilationValue">4</span>
            </div>
            <div class="control-row">
                <label>Crop</label>
                <input type="range" id="detCropFactor" min="1" max="4" step="0.1" value="1.5">
                <span id="detCropFactorValue">1.5</span>
            </div>
            <div class="control-row">
                <label>Drop</label>
                <input type="range" id="detDropSize" min="0" max="512" step="1" value="0">
                <span id="detDropSizeValue">0</span>
            </div>
            <div class="control-row">
                <label>Prompt</label>
                <input type="text" id="detPrompt" placeholder="empty">
            </div>
            <div class="control-row">
                <label>Fill</label>
                <input type="checkbox" id="detFillMask" checked>
            </div>
            <div class="control-row" style="justify-content: center;">
                <button class="control-button primary" id="detectButton">Detect</button>
            </div>
        </div>

        <!-- Brush panel (below detector, always visible) -->
        <div class="brush-panel" id="brushPanel">
            <div class="detector-title">Brush</div>
            <div class="control-row" style="gap: 4px; justify-content: center;">
                <button class="control-button brush-mode-btn active" id="brushBinary" style="flex:1; padding: 5px 8px; font-size: 11px;">Binary</button>
                <button class="control-button brush-mode-btn" id="brushLinear" style="flex:1; padding: 5px 8px; font-size: 11px;">Linear</button>
                <button class="control-button brush-mode-btn" id="brushExpo" style="flex:1; padding: 5px 8px; font-size: 11px;">Exponential</button>
            </div>
            <div class="control-row" id="brushStrengthRow">
                <label>Strength</label>
                <input type="range" id="brushStrength" min="0" max="1" step="0.01" value="1.0">
                <span id="brushStrengthValue">1.00</span>
            </div>
            <div class="control-row" id="brushCenterRow" style="display:none;">
                <label>Center</label>
                <input type="range" id="brushCenter" min="0" max="1" step="0.01" value="1.0">
                <span id="brushCenterValue">1.00</span>
            </div>
            <div class="control-row" id="brushEdgeRow" style="display:none;">
                <label>Edge</label>
                <input type="range" id="brushEdge" min="0" max="1" step="0.01" value="0.0">
                <span id="brushEdgeValue">0.00</span>
            </div>
            <div class="control-row" id="brushGammaRow" style="display:none;">
                <label>Gamma</label>
                <input type="range" id="brushGamma" min="0.1" max="10.0" step="0.1" value="2.0">
                <span id="brushGammaValue">2.0</span>
            </div>

            <div style="height:1px; background:rgba(255,255,255,0.08); margin: 4px 0;"></div>

            <div class="detector-title" style="color:#ff6b6b;">Eraser</div>
            <div class="control-row" style="gap: 4px; justify-content: center;">
                <button class="control-button eraser-mode-btn active" id="eraserBinary" style="flex:1; padding: 5px 8px; font-size: 11px;">Binary</button>
                <button class="control-button eraser-mode-btn" id="eraserLinear" style="flex:1; padding: 5px 8px; font-size: 11px;">Linear</button>
                <button class="control-button eraser-mode-btn" id="eraserExpo" style="flex:1; padding: 5px 8px; font-size: 11px;">Exponential</button>
            </div>
            <div class="control-row" id="eraserStrengthRow">
                <label>Strength</label>
                <input type="range" id="eraserStrength" min="0" max="1" step="0.01" value="1.0">
                <span id="eraserStrengthValue">1.00</span>
            </div>
            <div class="control-row" id="eraserCenterRow" style="display:none;">
                <label>Center</label>
                <input type="range" id="eraserCenter" min="0" max="1" step="0.01" value="1.0">
                <span id="eraserCenterValue">1.00</span>
            </div>
            <div class="control-row" id="eraserEdgeRow" style="display:none;">
                <label>Edge</label>
                <input type="range" id="eraserEdge" min="0" max="1" step="0.01" value="0.0">
                <span id="eraserEdgeValue">0.00</span>
            </div>
            <div class="control-row" id="eraserGammaRow" style="display:none;">
                <label>Gamma</label>
                <input type="range" id="eraserGamma" min="0.1" max="10.0" step="0.1" value="2.0">
                <span id="eraserGammaValue">2.0</span>
            </div>
        </div>
        </div>
    </div>

    <div class="bottom-bar">
        <!-- Grow slider -->
        <div class="control-group">
            <label>Grow</label>
            <input type="range" id="growSize" min="0" max="50" step="1" value="4">
            <span class="range-value" id="growSizeValue">4</span>
        </div>
        <!-- Grow button -->
        <button class="control-button warning" id="growButton">Grow</button>
        <div class="bottom-divider"></div>
        <!-- Size slider -->
        <div class="control-group">
            <label>Size</label>
            <input type="range" id="brushSize" min="2" max="9999" value="20">
            <span class="range-value" id="brushSizeValue">20</span>
        </div>
        <!-- Full button -->
        <button class="control-button" id="fullButton">Full</button>
        <!-- Clear button -->
        <button class="control-button" id="clearButton">Clear</button>
        <div class="bottom-divider"></div>
        <!-- Display alpha slider -->
        <div class="control-group">
            <label>Display</label>
            <input type="range" id="displayAlpha" min="0" max="1" step="0.01" value="0.5">
            <span class="range-value" id="displayAlphaValue">0.50</span>
        </div>
        <div class="bottom-divider"></div>
        <!-- Confirm -->
        <button class="confirm-btn" id="confirmButton">Confirm Mask</button>
    </div>

    <script>
        const imageContainer = document.getElementById('imageContainer');
        const baseImage = document.getElementById('baseImage');
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const brushSizeInput = document.getElementById('brushSize');
        const brushSizeValue = document.getElementById('brushSizeValue');
        const brushCursor = document.getElementById('brushCursor');
        const detectorPanel = document.getElementById('detectorPanel');
        const confirmButton = document.getElementById('confirmButton');

        let isDrawing = false;
        let brushSize = 20;
        let isErasing = false;
        let lastX = 0;
        let lastY = 0;
        let isOverImageArea = false;
        let hasDetector = false;
        let isAltResizing = false;
        let altResizeAnchorX = 0;
        let altResizeAnchorSize = 20;
        let altResizeBrushCenterX = 0;
        let altResizeBrushCenterY = 0;
        const ALT_RESIZE_SENSITIVITY = 0.5;
        let maskConfirmed = false;
        let currentLoop = '0';
        let displayAlpha = 0.5; // controls how strong the mask appears on the canvas (0..1)

        // Brush mode state
        let brushMode = 'binary';
        let brushStrength = 1.0;    // brush overall strength
        let brushCenter = 1.0;      // brush center alpha (linear)
        let brushEdge = 0.0;         // brush edge alpha (linear)
        let brushGamma = 2.0;        // brush falloff curve (exponential)

        // Eraser mode state (independent from brush)
        let eraserMode = 'binary';
        let eraserStrength = 1.0;
        let eraserCenter = 1.0;
        let eraserEdge = 0.0;
        let eraserGamma = 2.0;

        function setupBrushModeButtons() {
            const modes = [
                { id: 'brushBinary', mode: 'binary',
                  rows: { brushStrengthRow: true, brushCenterRow: false, brushEdgeRow: false, brushGammaRow: false } },
                { id: 'brushLinear', mode: 'linear',
                  rows: { brushStrengthRow: true, brushCenterRow: true, brushEdgeRow: true, brushGammaRow: false } },
                { id: 'brushExpo', mode: 'exponential',
                  rows: { brushStrengthRow: true, brushCenterRow: false, brushEdgeRow: false, brushGammaRow: true } },
            ];
            modes.forEach(m => {
                const btn = document.getElementById(m.id);
                btn.addEventListener('click', () => {
                    brushMode = m.mode;
                    modes.forEach(mm => document.getElementById(mm.id).classList.remove('active'));
                    btn.classList.add('active');
                    for (const [rowId, show] of Object.entries(m.rows)) {
                        document.getElementById(rowId).style.display = show ? 'flex' : 'none';
                    }
                });
            });
            const bindRange = (inputId, valId, setter) => {
                const el = document.getElementById(inputId);
                const valEl = document.getElementById(valId);
                el.addEventListener('input', () => { setter(parseFloat(el.value)); valEl.textContent = parseFloat(el.value).toFixed(2); });
            };
            bindRange('brushStrength', 'brushStrengthValue', v => brushStrength = v);
            bindRange('brushCenter', 'brushCenterValue', v => brushCenter = v);
            bindRange('brushEdge', 'brushEdgeValue', v => brushEdge = v);
            bindRange('brushGamma', 'brushGammaValue', v => brushGamma = v);
        }
        setupBrushModeButtons();

        // Eraser mode buttons setup (independent from brush)
        function setupEraserModeButtons() {
            const modes = [
                { id: 'eraserBinary', mode: 'binary',
                  rows: { eraserStrengthRow: true, eraserCenterRow: false, eraserEdgeRow: false, eraserGammaRow: false } },
                { id: 'eraserLinear', mode: 'linear',
                  rows: { eraserStrengthRow: true, eraserCenterRow: true, eraserEdgeRow: true, eraserGammaRow: false } },
                { id: 'eraserExpo', mode: 'exponential',
                  rows: { eraserStrengthRow: true, eraserCenterRow: false, eraserEdgeRow: false, eraserGammaRow: true } },
            ];
            modes.forEach(m => {
                const btn = document.getElementById(m.id);
                btn.addEventListener('click', () => {
                    eraserMode = m.mode;
                    modes.forEach(mm => document.getElementById(mm.id).classList.remove('active'));
                    btn.classList.add('active');
                    for (const [rowId, show] of Object.entries(m.rows)) {
                        document.getElementById(rowId).style.display = show ? 'flex' : 'none';
                    }
                });
            });
            const bindRange = (inputId, valId, setter) => {
                const el = document.getElementById(inputId);
                const valEl = document.getElementById(valId);
                el.addEventListener('input', () => { setter(parseFloat(el.value)); valEl.textContent = parseFloat(el.value).toFixed(2); });
            };
            bindRange('eraserStrength', 'eraserStrengthValue', v => eraserStrength = v);
            bindRange('eraserCenter', 'eraserCenterValue', v => eraserCenter = v);
            bindRange('eraserEdge', 'eraserEdgeValue', v => eraserEdge = v);
            bindRange('eraserGamma', 'eraserGammaValue', v => eraserGamma = v);
        }
        setupEraserModeButtons();

        // Display alpha slider — controls how strong the mask appears visually
        const displayAlphaInput = document.getElementById('displayAlpha');
        const displayAlphaVal = document.getElementById('displayAlphaValue');
        displayAlphaInput.addEventListener('input', () => {
            displayAlpha = parseFloat(displayAlphaInput.value);
            displayAlphaVal.textContent = displayAlpha.toFixed(2);
            // Redraw the canvas to reflect new display alpha
            redrawDisplay();
        });

        // Redraw the main canvas from snapshot + current mask state
        // We need a separate "committed mask" canvas that stores the true mask data,
        // then display it scaled by displayAlpha
        const maskDataCanvas = document.createElement('canvas');
        const maskDataCtx = maskDataCanvas.getContext('2d');

        function syncMaskDataCanvas() {
            if (maskDataCanvas.width !== canvas.width || maskDataCanvas.height !== canvas.height) {
                maskDataCanvas.width = canvas.width;
                maskDataCanvas.height = canvas.height;
            }
        }

        function redrawDisplay() {
            syncMaskDataCanvas();
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = displayAlpha;
            ctx.drawImage(maskDataCanvas, 0, 0);
            ctx.globalAlpha = 1;
        }

        async function loadImage() {
            try {
                const response = await fetch('/image_data', { cache: 'no-store' });
                const data = await response.json();

                const handleImageLoaded = () => {
                    setTimeout(() => {
                        const prevW = maskDataCanvas.width;
                        const prevH = maskDataCanvas.height;
                        fitCanvas();
                        syncMaskDataCanvas();
                        if (data.initial_mask) {
                            const maskImg = new Image();
                            maskImg.onload = () => {
                                maskDataCtx.globalCompositeOperation = 'source-over';
                                maskDataCtx.globalAlpha = 1;
                                maskDataCtx.clearRect(0, 0, maskDataCanvas.width, maskDataCanvas.height);
                                maskDataCtx.drawImage(maskImg, 0, 0, maskDataCanvas.width, maskDataCanvas.height);
                                redrawDisplay();
                            };
                            maskImg.src = data.initial_mask;
                        } else {
                            // No valid initial_mask for this image — clear
                            maskDataCtx.clearRect(0, 0, maskDataCanvas.width, maskDataCanvas.height);
                            redrawDisplay();
                        }
                        if (data.has_detector) {
                            hasDetector = true;
                            // CSS flex stack (#rightPanels) handles layout —
                            // no JS offset needed (safe even while iframe is display:none)
                            detectorPanel.classList.add('visible');
                        }
                        status.textContent = 'Ready';
                    }, 0);
                };

                if (baseImage.getAttribute('src') === data.image) {
                    handleImageLoaded();
                } else {
                    baseImage.onload = handleImageLoaded;
                    baseImage.src = data.image;
                }
            } catch (error) {
                console.error('Error loading image:', error);
                status.textContent = 'Error loading image';
            }
        }

        function fitCanvas() {
            const rect = baseImage.getBoundingClientRect();
            const containerRect = imageContainer.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) {
                setTimeout(fitCanvas, 50);
                return;
            }
            // Save old mask data if any
            const oldW = canvas.width;
            const oldH = canvas.height;
            const hasOldMask = oldW > 0 && oldH > 0 && maskDataCanvas.width > 0;
            let oldMaskData = null;
            if (hasOldMask) {
                syncMaskDataCanvas();
                oldMaskData = document.createElement('canvas');
                oldMaskData.width = maskDataCanvas.width;
                oldMaskData.height = maskDataCanvas.height;
                oldMaskData.getContext('2d').drawImage(maskDataCanvas, 0, 0);
            }
            // Set new display canvas size
            canvas.style.left = (rect.left - containerRect.left) + 'px';
            canvas.style.top = (rect.top - containerRect.top) + 'px';
            canvas.width = rect.width;
            canvas.height = rect.height;
            // Sync mask data canvas to new size
            syncMaskDataCanvas();
            maskDataCtx.clearRect(0, 0, maskDataCanvas.width, maskDataCanvas.height);
            // Restore old mask data scaled to new size
            if (oldMaskData && oldMaskData.width > 0) {
                maskDataCtx.drawImage(oldMaskData, 0, 0, maskDataCanvas.width, maskDataCanvas.height);
            }
            redrawDisplay();
        }

        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function updateCursorSize() {
            brushCursor.style.width = brushSize + 'px';
            brushCursor.style.height = brushSize + 'px';
        }
        function updateCursorMode() {
            if (isErasing) {
                brushCursor.classList.remove('draw');
                brushCursor.classList.add('erase');
            } else {
                brushCursor.classList.remove('erase');
                brushCursor.classList.add('draw');
            }
        }
        function moveCursor(e) {
            brushCursor.style.left = e.clientX + 'px';
            brushCursor.style.top = e.clientY + 'px';
        }

        // Offscreen stroke canvas — prevents alpha accumulation within a single stroke (PS-style)
        const strokeCanvas = document.createElement('canvas');
        const strokeCtx = strokeCanvas.getContext('2d');
        // Snapshot of main canvas before the current stroke — used for live preview
        const snapshotCanvas = document.createElement('canvas');
        const snapshotCtx = snapshotCanvas.getContext('2d');

        function syncStrokeCanvas() {
            if (strokeCanvas.width !== canvas.width || strokeCanvas.height !== canvas.height) {
                strokeCanvas.width = canvas.width;
                strokeCanvas.height = canvas.height;
            }
            if (snapshotCanvas.width !== canvas.width || snapshotCanvas.height !== canvas.height) {
                snapshotCanvas.width = canvas.width;
                snapshotCanvas.height = canvas.height;
            }
        }

        // Compute the brush/eraser radial gradient for the current mode
        function makeBrushGradient(cx, cy, r) {
            const grad = strokeCtx.createRadialGradient(cx, cy, 0, cx, cy, r);
            // Use eraser params when erasing, brush params when drawing
            const mode = isErasing ? eraserMode : brushMode;
            const strength = isErasing ? eraserStrength : brushStrength;
            const center = isErasing ? eraserCenter : brushCenter;
            const edge = isErasing ? eraserEdge : brushEdge;
            const gamma = isErasing ? eraserGamma : brushGamma;
            const color = '255, 0, 0';
            if (mode === 'binary') {
                grad.addColorStop(0, `rgba(${color}, ${strength})`);
                grad.addColorStop(1, `rgba(${color}, ${strength})`);
            } else if (mode === 'linear') {
                grad.addColorStop(0, `rgba(${color}, ${center * strength})`);
                grad.addColorStop(1, `rgba(${color}, ${edge * strength})`);
            } else { // exponential
                const stops = 20;
                for (let i = 0; i <= stops; i++) {
                    const t = i / stops;
                    const a = strength * Math.pow(1 - t, gamma);
                    grad.addColorStop(t, `rgba(${color}, ${a})`);
                }
            }
            return grad;
        }

        function drawDot(x, y) {
            syncStrokeCanvas();
            const r = brushSize / 2;
            if (isErasing) {
                strokeCtx.globalCompositeOperation = 'source-over';
                strokeCtx.fillStyle = 'rgba(255, 0, 0, 1)'; // full erase in stroke canvas
                strokeCtx.beginPath();
                strokeCtx.arc(x, y, r, 0, Math.PI * 2);
                strokeCtx.fill();
            } else {
                strokeCtx.globalCompositeOperation = 'source-over';
                strokeCtx.fillStyle = makeBrushGradient(x, y, r);
                strokeCtx.beginPath();
                strokeCtx.arc(x, y, r, 0, Math.PI * 2);
                strokeCtx.fill();
            }
        }

        function drawStroke(x, y) {
            syncStrokeCanvas();
            const r = brushSize / 2;
            if (isErasing) {
                strokeCtx.globalCompositeOperation = 'source-over';
                strokeCtx.strokeStyle = 'rgba(255, 0, 0, 1)';
                strokeCtx.fillStyle = 'rgba(255, 0, 0, 1)';
            } else {
                strokeCtx.globalCompositeOperation = 'source-over';
                strokeCtx.strokeStyle = makeBrushGradient(x, y, r);
                strokeCtx.fillStyle = makeBrushGradient(x, y, r);
            }
            strokeCtx.lineCap = 'round';
            strokeCtx.lineJoin = 'round';
            strokeCtx.lineWidth = brushSize;
            strokeCtx.beginPath();
            strokeCtx.moveTo(lastX, lastY);
            strokeCtx.lineTo(x, y);
            strokeCtx.stroke();
            drawDot(x, y);
        }

        // Live preview: restore snapshot into maskData, composite stroke, then display with displayAlpha
        function livePreviewStroke() {
            syncMaskDataCanvas();
            // Restore pre-stroke mask data
            maskDataCtx.globalCompositeOperation = 'source-over';
            maskDataCtx.globalAlpha = 1;
            maskDataCtx.clearRect(0, 0, maskDataCanvas.width, maskDataCanvas.height);
            maskDataCtx.drawImage(snapshotCanvas, 0, 0);
            // Composite stroke into mask data
            if (isErasing) {
                maskDataCtx.globalCompositeOperation = 'destination-out';
                maskDataCtx.globalAlpha = 1;
            } else {
                maskDataCtx.globalCompositeOperation = 'source-over';
                maskDataCtx.globalAlpha = 1;
            }
            maskDataCtx.drawImage(strokeCanvas, 0, 0);
            maskDataCtx.globalAlpha = 1;
            maskDataCtx.globalCompositeOperation = 'source-over';
            // Display mask data scaled by displayAlpha
            redrawDisplay();
        }

        // Commit the stroke (PS-style: one stroke = one alpha layer)
        function commitStroke() {
            livePreviewStroke();
            strokeCtx.clearRect(0, 0, strokeCanvas.width, strokeCanvas.height);
        }

        // Sync mask to backend. Called on tab switch and confirm.
        async function syncMask() {
            await sendMask();
        }

        // --- Mouse events on imageContainer (not just canvas) ---
        // This ensures Alt+Drag resize continues even if the mouse leaves the canvas
        // but stays within the container.
        imageContainer.addEventListener('mouseenter', () => {
            isOverImageArea = true;
            brushCursor.style.display = 'block';
        });
        imageContainer.addEventListener('mouseleave', () => {
            isOverImageArea = false;
            // Only hide cursor and stop drawing if NOT in Alt+Drag resize mode
            if (!isAltResizing) {
                brushCursor.style.display = 'none';
                isDrawing = false;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isAltResizing) {
                // PS-style: keep brush center fixed at the position where Alt+Drag started.
                const dx = e.clientX - altResizeAnchorX;
                const newSize = altResizeAnchorSize + dx * ALT_RESIZE_SENSITIVITY;
                brushSize = Math.max(2, Math.round(newSize));
                brushSizeInput.value = brushSize;
                brushSizeValue.textContent = brushSize;
                updateCursorSize();
                // Keep cursor at the anchored center
                brushCursor.style.left = altResizeBrushCenterX + 'px';
                brushCursor.style.top = altResizeBrushCenterY + 'px';
                return;
            }
            moveCursor(e);
            if (!isDrawing) return;
            const pos = getCanvasPos(e);
            drawStroke(pos.x, pos.y);
            livePreviewStroke();
            lastX = pos.x;
            lastY = pos.y;
        });

        // Mouse down on canvas — start drawing or Alt+Drag resize
        canvas.addEventListener('mousedown', (e) => {
            if (e.altKey) {
                isAltResizing = true;
                altResizeAnchorX = e.clientX;
                altResizeAnchorSize = brushSize;
                altResizeBrushCenterX = e.clientX;
                altResizeBrushCenterY = e.clientY;
                e.preventDefault();
                return;
            }
            if (e.button === 0) { isErasing = false; isDrawing = true; }
            else if (e.button === 2) { isErasing = true; isDrawing = true; }
            else { return; }
            updateCursorMode();
            syncStrokeCanvas();
            // Save snapshot of current main canvas state (for live preview)
            snapshotCtx.clearRect(0, 0, snapshotCanvas.width, snapshotCanvas.height);
            snapshotCtx.drawImage(maskDataCanvas, 0, 0);
            strokeCtx.clearRect(0, 0, strokeCanvas.width, strokeCanvas.height);
            const pos = getCanvasPos(e);
            lastX = pos.x;
            lastY = pos.y;
            drawDot(lastX, lastY);
            livePreviewStroke();
            e.preventDefault();
        });
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('mouseup', (e) => {
            if (isDrawing) {
                commitStroke();
            }
            isDrawing = false;
            if (isAltResizing) {
                isAltResizing = false;
                moveCursor(e);
            }
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 2 : -2;
            let newSize = brushSize + delta;
            newSize = Math.max(2, newSize);
            brushSize = newSize;
            brushSizeInput.value = brushSize;
            brushSizeValue.textContent = brushSize;
            updateCursorSize();
        }, { passive: false });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length !== 1) return;
            isDrawing = true;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            syncStrokeCanvas();
            snapshotCtx.clearRect(0, 0, snapshotCanvas.width, snapshotCanvas.height);
            snapshotCtx.drawImage(maskDataCanvas, 0, 0);
            strokeCtx.clearRect(0, 0, strokeCanvas.width, strokeCanvas.height);
            lastX = touch.clientX - rect.left;
            lastY = touch.clientY - rect.top;
            drawDot(lastX, lastY);
            livePreviewStroke();
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDrawing || e.touches.length !== 1) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            drawStroke(x, y);
            livePreviewStroke();
            lastX = x;
            lastY = y;
        }, { passive: false });
        canvas.addEventListener('touchend', () => {
            if (isDrawing) commitStroke();
            isDrawing = false;
        });

        // Brush size slider
        brushSizeInput.addEventListener('input', (e) => {
            brushSize = parseInt(e.target.value);
            brushSizeValue.textContent = brushSize;
            updateCursorSize();
        });

        // Clear
        document.getElementById('clearButton').addEventListener('click', async () => {
            syncMaskDataCanvas();
            maskDataCtx.clearRect(0, 0, maskDataCanvas.width, maskDataCanvas.height);
            redrawDisplay();
            try {
                await fetch('/clear', { method: 'POST' });
            } catch (err) {
                console.error('Clear failed:', err);
            }
        });

        // Full - fill entire mask data with full strength
        document.getElementById('fullButton').addEventListener('click', () => {
            syncMaskDataCanvas();
            maskDataCtx.globalCompositeOperation = 'source-over';
            maskDataCtx.globalAlpha = 1;
            maskDataCtx.fillStyle = 'rgba(255, 0, 0, 1)';
            maskDataCtx.fillRect(0, 0, maskDataCanvas.width, maskDataCanvas.height);
            redrawDisplay();
            status.textContent = 'Full mask applied';
            status.classList.add('success');
        });

        // Grow size slider
        const growSizeInput = document.getElementById('growSize');
        const growSizeValue = document.getElementById('growSizeValue');
        growSizeInput.addEventListener('input', (e) => {
            growSizeValue.textContent = e.target.value;
        });

        // Grow button
        document.getElementById('growButton').addEventListener('click', async () => {
            const grow = parseInt(growSizeInput.value);
            if (grow <= 0) return;
            status.textContent = 'Growing mask...';
            status.classList.remove('success');
            try {
                const maskBase64 = maskDataCanvas.toDataURL('image/png');
                const response = await fetch('/grow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mask: maskBase64, grow: grow })
                });
                const result = await response.json();
                if (response.ok && result.mask) {
                    const maskImg = new Image();
                    maskImg.onload = () => {
                        syncMaskDataCanvas();
                        maskDataCtx.globalCompositeOperation = 'source-over';
                        maskDataCtx.globalAlpha = 1;
                        maskDataCtx.clearRect(0, 0, maskDataCanvas.width, maskDataCanvas.height);
                        maskDataCtx.drawImage(maskImg, 0, 0, maskDataCanvas.width, maskDataCanvas.height);
                        redrawDisplay();
                        status.textContent = 'Mask grown';
                        status.classList.add('success');
                    };
                    maskImg.src = result.mask;
                } else {
                    status.textContent = 'Grow error: ' + (result.error || 'unknown');
                }
            } catch (err) {
                console.error(err);
                status.textContent = 'Grow failed';
            }
        });

        // Detector params live update labels
        function bindRange(id, valId) {
            const el = document.getElementById(id);
            const valEl = document.getElementById(valId);
            if (!el || !valEl) return;
            el.addEventListener('input', () => { valEl.textContent = el.value; });
        }
        bindRange('detThreshold', 'detThresholdValue');
        bindRange('detStrength', 'detStrengthValue');
        bindRange('detDilation', 'detDilationValue');
        bindRange('detCropFactor', 'detCropFactorValue');
        bindRange('detDropSize', 'detDropSizeValue');

        // Detect button
        document.getElementById('detectButton').addEventListener('click', async () => {
            if (!hasDetector) return;
            status.textContent = 'Detecting...';
            status.classList.remove('success');
            try {
                const params = {
                    threshold: parseFloat(document.getElementById('detThreshold').value),
                    strength: parseFloat(document.getElementById('detStrength').value),
                    dilation: parseInt(document.getElementById('detDilation').value),
                    crop_factor: parseFloat(document.getElementById('detCropFactor').value),
                    drop_size: parseInt(document.getElementById('detDropSize').value),
                    prompt: document.getElementById('detPrompt').value,
                    fill_mask: document.getElementById('detFillMask').checked,
                };
                const response = await fetch('/detect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params)
                });
                const result = await response.json();
                if (response.ok && result.mask) {
                    const maskImg = new Image();
                    maskImg.onload = () => {
                        syncMaskDataCanvas();
                        maskDataCtx.globalCompositeOperation = 'source-over';
                        maskDataCtx.globalAlpha = 1;
                        maskDataCtx.clearRect(0, 0, maskDataCanvas.width, maskDataCanvas.height);
                        maskDataCtx.drawImage(maskImg, 0, 0, maskDataCanvas.width, maskDataCanvas.height);
                        redrawDisplay();
                        status.textContent = 'Detection applied';
                        status.classList.add('success');
                    };
                    maskImg.src = result.mask;
                } else if (response.ok) {
                    status.textContent = result.message || 'No objects detected';
                } else {
                    status.textContent = 'Detect error: ' + (result.error || 'unknown');
                }
            } catch (err) {
                console.error(err);
                status.textContent = 'Detect failed';
            }
        });

        // Send mask (Confirm / Update) — 只同步到后端并通知父级，不关闭窗口
        async function sendMask() {
            try {
                const base64 = maskDataCanvas.toDataURL('image/png');
                const response = await fetch('/mask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mask: base64, loop: currentLoop })
                });
                if (response.ok) {
                    maskConfirmed = true;
                    status.textContent = 'Mask confirmed';
                    status.classList.add('success');
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'mask-confirmed' }, '*');
                    }
                } else {
                    status.textContent = 'Error sending mask';
                    status.classList.remove('success');
                }
            } catch (error) {
                console.error('Error sending mask:', error);
                status.textContent = 'Error sending mask';
                status.classList.remove('success');
            }
        }

        confirmButton.addEventListener('click', sendMask);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMask();
        });

        // Listen for messages from parent window
        window.addEventListener('message', (event) => {
            if (event.data?.type === 'get-mask') {
                const base64 = maskDataCanvas.toDataURL('image/png');
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'mask-data',
                        mask: base64,
                        brush_mode: brushMode,
                        strength: brushStrength,
                        center: brushCenter,
                        edge: brushEdge,
                        gamma: brushGamma,
                    }, '*');
                }
            } else if (event.data?.type === 'sync-mask') {
                sendMask();
            } else if (event.data?.type === 'new-loop' || event.data?.type === 'reload-image') {
                // Don't clear mask — loadImage will restore via initial_mask if dimensions match
                maskConfirmed = false;
                status.textContent = 'Loading...';
                status.classList.remove('success');
                loadImage();
            }
        });

        window.addEventListener('beforeunload', async () => {
            try {
                await fetch('/window_closed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ closed: true })
                });
            } catch (error) {
                console.error('Error notifying window close:', error);
            }
        });

        window.addEventListener('resize', () => {
            // fitCanvas now handles saving/restoring maskDataCanvas
            fitCanvas();
        });

        function initOnLoad() {
            loadImage();
            updateCursorSize();
            updateCursorMode();
        }
        if (document.readyState === 'complete') {
            initOnLoad();
        } else {
            window.addEventListener('load', initOnLoad);
        }
    </script>
</body>
</html>
