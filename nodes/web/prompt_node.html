        // 截图功能
        async function captureScreenshot(mode) {
            try {
                // 请求后端截图（后端会显示独立的PySide6准备面板）
                const response = await fetch('/capture_screenshot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!response.ok) {
                    throw new Error('Screenshot failed');
                }
                
                const data = await response.json();
                if (data.success && data.image_data) {
                    // 显示预览
                    const previewImg = document.getElementById(`${mode}ImagePreview`);
                    previewImg.src = data.image_data;
                    previewImg.classList.add('visible');
                    
                    // 创建一个File对象，以便后续提交时使用
                    const byteString = atob(data.image_data.split(',')[1]);
                    const mimeString = data.image_data.split(',')[0].split(':')[1].split(';')[0];
                    const ab = new ArrayBuffer(byteString.length);
                    const ia = new Uint8Array(ab);
                    for (let i = 0; i < byteString.length; i++) {
                        ia[i] = byteString.charCodeAt(i);
                    }
                    const blob = new Blob([ab], { type: mimeString });
                    const file = new File([blob], `screenshot_${Date.now()}.png`, { type: mimeString });
                    
                    // 创建 DataTransfer 对象来模拟文件选择
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    document.getElementById(`${mode}Image`).files = dataTransfer.files;
                } else {
                    alert('Screenshot failed: ' + (data.error || 'Unknown error'));
                }
            } catch (e) {
                console.error('Screenshot error:', e);
                alert('Failed to capture screenshot: ' + e.message);
            }
        }

            const y = ((e.clientY - rect.top - rr.offsetY) / rr.renderH) * 100;

            const markerX = ((e.clientX - rect.left) / rect.width) * 100;
            const markerY = ((e.clientY - rect.top) / rect.height) * 100;

        function toggleLibrary(libName) {
            const categoryDiv = document.getElementById(`library-${libName}`);
            const isExpanded = expandedLibraries.has(libName);
            const libData = allLibraries[libName] || {};
            const bgImage = libData.bg_image || '';

            if (isExpanded) {
                expandedLibraries.delete(libName);
                categoryDiv.classList.remove('expanded');
                categoryDiv.classList.add('collapsed');

                const bgMask = categoryDiv.querySelector('.category-background-mask');
                if (bgMask) {
                    bgMask.remove();
                }

                const content = document.getElementById(`libcat-${libName}`);
                if (content) {
                    content.remove();
                }

                const header = categoryDiv.querySelector('.category-header');
                if (header && bgImage) {
                    if (!header.querySelector('.bg-image')) {
                        const img = document.createElement('img');
                        img.src = `/images/${bgImage}`;
                        img.className = 'bg-image';
                        img.alt = '';
                        img.onload = () => onCategoryBgImageLoad(img, libName);
                        header.insertBefore(img, header.firstChild);
                    }
                }
            } else {
                expandedLibraries.add(libName);
                categoryDiv.classList.remove('collapsed');
                categoryDiv.classList.add('expanded');

                if (bgImage) {
                    const bgMask = document.createElement('div');
                    bgMask.className = 'category-background-mask';

                    const bgContainer = document.createElement('div');
                    bgContainer.className = 'category-background';
                    bgContainer.style.backgroundImage = `url(/images/${bgImage})`;
                    bgContainer.style.backgroundPosition = 'center';

                    bgMask.appendChild(bgContainer);
                    categoryDiv.insertBefore(bgMask, categoryDiv.firstChild);

                    setBackgroundScale(bgContainer, `/images/${bgImage}`, libName);
                }

                const header = categoryDiv.querySelector('.category-header');
                const headerBgImg = header.querySelector('.bg-image');
                if (headerBgImg) {
                    headerBgImg.remove();
                }

                const libPromptIds = libData.prompt_ids || [];
                const prompts = [];
                for (const [cat, catData] of Object.entries(allPrompts)) {
                    const catPrompts = catData.prompts || [];
                    for (const p of catPrompts) {
                        if (libPromptIds.includes(p.id)) {
                            prompts.push({ ...p, category: cat });
                        }
                    }
                }

                const displayMode = libData.display_mode || 'horizontal';
                const sizeMode = libData.size_mode || 'normal';

                const contentDiv = document.createElement('div');
                contentDiv.className = `category-content animating ${displayMode === 'box' ? 'box-mode' : ''} ${sizeMode === 'mini' ? 'mini-mode' : ''}`;
                contentDiv.id = `libcat-${libName}`;

                const isMiniMode = sizeMode === 'mini';
                const modeClass = isMiniMode ? 'mini-mode' : 'normal-mode';

                for (const p of prompts) {
                    const focusStyle = getFocusStyle(p.id);
                    const wrapperDiv = document.createElement('div');
                    wrapperDiv.className = 'prompt-item-wrapper';
                    wrapperDiv.innerHTML = `
                        <div class="prompt-item ${modeClass}"
                            data-prompt="${p.prompt}" data-id="${p.id}" data-category="${p.category}">
                            <span class="drag-handle" data-drag-type="prompt" data-id="${p.id}" data-category="${p.category}" title="Drag to reorder">⋮⋮</span>
                            <div class="select-area" style="width: 100%; height: 100%; position: relative;">
                                <div class="image-layer">
                                    ${p.preview ? `<img src="/images/${p.preview}" alt="${p.name}" loading="lazy" style="${focusStyle}" onload="onPromptImageLoad(this, '${p.id}')">` : '<div class="no-image">No Image</div>'}
                                </div>
                                ${!isMiniMode ? '<div class="glass-layer"></div>' : ''}
                                <div class="text-layer">
                                    <div class="name">${p.name}</div>
                                    <div class="prompt-text">${p.prompt}</div>
                                </div>
                            </div>
                            <div class="actions">
                                <button class="action-btn edit" data-action="edit" data-id="${p.id}" data-category="${p.category}">✏️</button>
                                <button class="action-btn delete" data-action="delete" data-id="${p.id}">🗑️</button>
                            </div>
                        </div>
                    `;
                    contentDiv.appendChild(wrapperDiv);
                }

                // 渲染 prefab items (toggle)
                const prefabs = libData.prefabs || [];
                for (let pi = 0; pi < prefabs.length; pi++) {
                    const pf = prefabs[pi];
                    const pfKey = `prefab_${libName}_${pi}`;
                    const pfFocusStyle = getFocusStyle(pfKey);
                    const displayStr = pf.tags.map(group => tagsToDisplayName(group)).join(' + ');
                    const state = getPrefabMatchState(pf.tags);
                    const stateClass = state === 'full' ? 'prefab-full' : state === 'partial' ? 'prefab-partial' : '';
                    const wrapperDiv = document.createElement('div');
                    wrapperDiv.className = 'prompt-item-wrapper';
                    wrapperDiv.innerHTML = `
                        <div class="prompt-item ${modeClass} ${stateClass}"
                            data-prefab="${pfKey}" data-library="${libName}" data-prefab-index="${pi}" style="cursor: pointer;">
                            <span class="drag-handle" data-drag-type="prefab" data-library="${libName}" data-index="${pi}">⋮⋮</span>
                            <div class="select-area" style="width: 100%; height: 100%; position: relative;">
                                <div class="image-layer">
                                    ${pf.preview ? `<img src="/images/${pf.preview}" alt="${pf.name}" loading="lazy" style="${pfFocusStyle}" onload="onPromptImageLoad(this, '${pfKey}')">` : '<div class="no-image">No Image</div>'}
                                </div>
                                ${!isMiniMode ? '<div class="glass-layer"></div>' : ''}
                                <div class="text-layer">
                                    <div class="name" style="color: var(--accent-color);">${pf.name}</div>
                                    <div class="prompt-text">${displayStr}</div>
                                </div>
                            </div>
                            <div class="actions" style="position: absolute; top: 4px; right: 4px;">
                                <button class="action-btn edit" onclick="event.stopPropagation(); openEditPrefabModal('${libName}', ${pi})">✏️</button>
                                <button class="action-btn delete" onclick="event.stopPropagation(); deleteLibraryPrefab('${libName}', ${pi})">🗑️</button>
                            </div>
                        </div>
                    `;
                    const item = wrapperDiv.querySelector('.prompt-item');
                    let clickTimer = null;
                    item.onclick = () => {
                        if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; return; }
                        clickTimer = setTimeout(() => {
                            clickTimer = null;
                            mergePrefab(pf);
                        }, 250);
                    };
                    item.ondblclick = (e) => {
                        e.stopPropagation();
                        if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
                        replacePrefab(pf);
                    };
                    contentDiv.appendChild(wrapperDiv);
                }

                // +Add Prefab 按钮
                if (selectedTags.length > 0) {
                    const addPfDiv = document.createElement('div');
                    addPfDiv.className = `prompt-item add-prompt-btn ${modeClass}`;
                    addPfDiv.style.cssText = 'cursor: pointer;';
                    addPfDiv.dataset.library = libName;
                    addPfDiv.innerHTML = '<div style="font-size: 12px;">+ Add Prefab</div>';
                    addPfDiv.onclick = () => openAddPrefabModal(libName);
                    contentDiv.appendChild(addPfDiv);
                }

                categoryDiv.appendChild(contentDiv);

                contentDiv.addEventListener('animationend', () => {
                    contentDiv.classList.remove('animating');
                }, { once: true });

                initDragEvents();
            }

            const toggle = categoryDiv.querySelector('.toggle');
            if (toggle) {
                toggle.textContent = expandedLibraries.has(libName) ? '▲' : '▼';
            }
        }

        function getPrefabMatchState(prefabTags) {
            let matchCount = 0;
            const total = prefabTags.length;
            if (total === 0) return 'none';
            for (const group of prefabTags) {
                const baseTag = group.find(t => t.decoration_num === 0);
                if (baseTag && isBasePromptSelectedInTags(baseTag.prompt)) {
                    matchCount++;
                }
            }
            if (matchCount === 0) return 'none';
            if (matchCount < total) return 'partial';
            return 'full';
        }

        function mergePrefab(pf) {
            const prefabTags = pf.tags || [];
            const prefabCp = pf.custom_prompts || '';

            // 判断是否所有 prefab 的 tag group 都已选中
            let allMatched = true;
            let anyMatched = false;
            for (const group of prefabTags) {
                const baseTag = group.find(t => t.decoration_num === 0);
                if (baseTag && isBasePromptSelectedInTags(baseTag.prompt)) {
                    anyMatched = true;
                } else {
                    allMatched = false;
                }
            }

            if (allMatched && anyMatched) {
                // 全有 → 删除所有匹配的 group
                for (const group of prefabTags) {
                    const baseTag = group.find(t => t.decoration_num === 0);
                    if (baseTag) {
                        const idx = findTagGroupIndex(baseTag.prompt);
                        if (idx !== -1) selectedTags.splice(idx, 1);
                    }
                }
            } else {
                // 部分或没有 → 添加所有缺失的 group
                for (const group of prefabTags) {
                    const baseTag = group.find(t => t.decoration_num === 0);
                    if (baseTag && !isBasePromptSelectedInTags(baseTag.prompt)) {
                        selectedTags.push(group.map(t => ({ ...t })));
                    }
                }
            }

            // custom_prompts 合并
            if (prefabCp) {
                const currentCp = document.getElementById('customPromptInput').value;
                const prefabSegments = prefabCp.split('\n').map(s => s.trim()).filter(s => s);
                const currentSegments = currentCp.split('\n').map(s => s.trim()).filter(s => s);

                if (allMatched && anyMatched) {
                    // 全有 → 删除 prefab 中出现的所有段
                    const remaining = currentSegments.filter(s => !prefabSegments.includes(s));
                    document.getElementById('customPromptInput').value = remaining.join('\n');
                } else {
                    // 部分或没有 → 添加不存在的段
                    for (const seg of prefabSegments) {
                        if (!currentSegments.includes(seg)) {
                            currentSegments.push(seg);
                        }
                    }
                    document.getElementById('customPromptInput').value = currentSegments.join('\n');
                }
            }

            updateSelectedTags();
            renderCategories();
            initDragEvents();
        }

        function setupDropTargets() {
            // 全局管理drag-over状态，防止边界抖动
            let dragOverTimer = null;
            
            // === 类别拖放目标 ===
            document.querySelectorAll('.category').forEach(category => {
                const catHeader = category.querySelector('.category-header');
                if (catHeader) {
                    catHeader.addEventListener('dragover', (e) => {
                        if (dragState.type === 'category' && category.id !== `category-${dragState.item}`) {
                            e.preventDefault();
                            e.stopPropagation();
                            // 防止重复设置
                            if (!category.classList.contains('drag-over')) {
                                clearTimeout(dragOverTimer);
                                dragOverTimer = null;
                                category.classList.add('drag-over');
                            }
                        }
                    });
                    
                    catHeader.addEventListener('dragleave', (e) => {
                        // 延迟移除drag-over，防止边界抖动
                        const rect = catHeader.getBoundingClientRect();
                        const isStillOver = e.clientX >= rect.left && e.clientX <= rect.right &&
                                        e.clientY >= rect.top && e.clientY <= rect.bottom;
                        
                        if (!isStillOver) {
                            dragOverTimer = setTimeout(() => {
                                category.classList.remove('drag-over');
                            }, 50);
                        }
                    });
                    
                    catHeader.addEventListener('drop', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        clearTimeout(dragOverTimer);
                        dragOverTimer = null;
                        category.classList.remove('drag-over');
                        
                        if (dragState.type === 'category') {
                            const targetCategory = category.id.replace('category-', '');
                            if (dragState.item !== targetCategory) {
                                await reorderCategories(dragState.item, targetCategory, 'at');
                            }
                        }
                    });
                }
            });

                    if (dragState.type === 'category') {
                        e.preventDefault();
                        if (!card.classList.contains('drag-over')) {
                            card.classList.add('drag-over');
                        }
                    }
                });
                
                card.addEventListener('dragleave', () => {
                    card.classList.remove('drag-over');
                });
                
                card.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    card.classList.remove('drag-over');
                    
                    if (dragState.type === 'category') {
                        await reorderCategories(dragState.item, null, 'end');
                    }
                });
            });

            // === Library 拖放目标 ===
            document.querySelectorAll('.category[id^="library-"]').forEach(lib => {
                const libHeader = lib.querySelector('.category-header');
                if (libHeader) {
                    libHeader.addEventListener('dragover', (e) => {

                            e.stopPropagation();

                    });

                        const isStillOver = e.clientX >= rect.left && e.clientX <= rect.right &&
                                        e.clientY >= rect.top && e.clientY <= rect.bottom;
                        if (!isStillOver) {
                            setTimeout(() => lib.classList.remove('drag-over'), 50);
                        }
                    });
                    libHeader.addEventListener('drop', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        lib.classList.remove('drag-over');
                        if (dragState.type === 'library') {
                            const targetLib = lib.id.replace('library-', '');

                                await reorderLibraries(dragState.item, targetLib, 'at');
                            }
                        }
                    });
                }
            });

            // === 添加Library卡片（拖到末尾） ===
            document.querySelectorAll('.add-library-card').forEach(card => {
                card.addEventListener('dragover', (e) => {
                    if (dragState.type === 'library') {
                        e.preventDefault();
                        if (!card.classList.contains('drag-over')) {
                            card.classList.add('drag-over');
                        }
                    }
                });
                card.addEventListener('dragleave', () => {
                    card.classList.remove('drag-over');

                        await reorderLibraries(dragState.item, null, 'end');

            promptDropTargets.forEach(item => {
                let itemDragTimer = null;
                
                item.addEventListener('dragover', (e) => {
                    if (dragState.type === 'prompt') {
                        console.log('[Drag] dragover 触发:', item.dataset.id);
                        e.preventDefault();
                        e.stopPropagation();
                        clearTimeout(itemDragTimer);
                        itemDragTimer = null;
                        if (!item.classList.contains('drag-over')) {
                            item.classList.add('drag-over');
                        }
                    }
                });
                
                item.addEventListener('dragleave', (e) => {
                    // 检查鼠标是否真的离开了
                    const rect = item.getBoundingClientRect();
                    const isStillOver = e.clientX >= rect.left && e.clientX <= rect.right &&
                                       e.clientY >= rect.top && e.clientY <= rect.bottom;
                    
                    if (!isStillOver) {
                        itemDragTimer = setTimeout(() => {
                            item.classList.remove('drag-over');
                        }, 50);
                    }
                });
                
                item.addEventListener('drop', async (e) => {
                    console.log('[Drag] drop 触发:', item.dataset.id);
                    e.preventDefault();
                    e.stopPropagation();
                    clearTimeout(itemDragTimer);
                    itemDragTimer = null;
                    item.classList.remove('drag-over');
                    
                    if (dragState.type === 'prompt') {
                        const targetId = item.dataset.id;
                        const targetCategory = item.dataset.category;
                        console.log('[Drag] drop 处理:', dragState.item, '->', targetId, 'cat:', dragState.category, '->', targetCategory);
                        
                        if (targetId && dragState.item !== targetId) {
                            if (dragState.category === targetCategory) {
                                await reorderPrompts(dragState.category, dragState.item, targetId, 'at');
                            } else {
                                await movePromptToCategory(dragState.category, targetCategory, dragState.item, targetId);
                            }
                        }
                    }
                });
            });

            // === Prefab 拖放目标 ===
            const prefabDropTargets = document.querySelectorAll('.prompt-item[data-prefab]');
            prefabDropTargets.forEach(item => {
                let pfDragTimer = null;
                item.addEventListener('dragover', (e) => {
                    if (dragState.type === 'prefab') {
                        e.preventDefault();
                        e.stopPropagation();
                        clearTimeout(pfDragTimer);
                        pfDragTimer = null;
                        if (!item.classList.contains('drag-over')) {
                            item.classList.add('drag-over');
                        }
                    }
                });
                item.addEventListener('dragleave', (e) => {
                    const rect = item.getBoundingClientRect();
                    const isStillOver = e.clientX >= rect.left && e.clientX <= rect.right &&
                                       e.clientY >= rect.top && e.clientY <= rect.bottom;
                    if (!isStillOver) {
                        pfDragTimer = setTimeout(() => {
                            item.classList.remove('drag-over');
                        }, 50);
                    }
                });
                item.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    clearTimeout(pfDragTimer);
                    pfDragTimer = null;
                    item.classList.remove('drag-over');
                    if (dragState.type === 'prefab') {
                        const targetLib = item.dataset.library;
                        const targetIndex = parseInt(item.dataset.prefabIndex);
                        if (dragState.library === targetLib) {
                            await reorderLibraryPrefabs(targetLib, dragState.index, targetIndex);
                        } else {
                            await movePrefabToLibrary(dragState.library, targetLib, dragState.index, targetIndex);
                        }
                    }
                });
            });

            // === 添加提示词按钮（拖到末尾） ===
            document.querySelectorAll('.add-prompt-btn').forEach(btn => {
                btn.addEventListener('dragover', (e) => {
                    if (dragState.type === 'prompt' || dragState.type === 'prefab') {
                        e.preventDefault();
                        if (!btn.classList.contains('drag-over')) {
                            btn.classList.add('drag-over');
                        }
                    }
                });
                
                btn.addEventListener('dragleave', () => {
                    btn.classList.remove('drag-over');
                });
                
                btn.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    btn.classList.remove('drag-over');
                    
                    if (dragState.type === 'prompt') {
                        const targetCategory = btn.dataset.category;
                        if (targetCategory) {
                            if (dragState.category === targetCategory) {
                                await reorderPrompts(dragState.category, dragState.item, null, 'end');
                            } else {
                                await movePromptToCategory(dragState.category, targetCategory, dragState.item, null);
                            }
                        }
                    } else if (dragState.type === 'prefab') {
                        const targetLib = btn.dataset.library;
                        if (targetLib && dragState.library === targetLib) {
                            await reorderLibraryPrefabs(targetLib, dragState.index, null);
                        } else if (targetLib && dragState.library !== targetLib) {
                            await movePrefabToLibrary(dragState.library, targetLib, dragState.index, null);
                        }
                    }
                });
            });
        }

        // Zoom View - 延迟 2s 进入仔细看模式
        let zoomTimer = null;
        let leaveTimer = null;
        let currentZoomItem = null;
        let isDragging = false; // 标记是否正在拖拽

        function clearZoomView() {
            clearTimeout(zoomTimer);
            clearTimeout(leaveTimer);
            zoomTimer = null;
            leaveTimer = null;
            if (currentZoomItem) {
                currentZoomItem.classList.remove('zoom-view');
                currentZoomItem = null;
            }
        }
        
        // 计算zoom-view尺寸：按1024*1024像素量等比例缩放
        function setZoomViewSize(promptItem) {
            const img = promptItem.querySelector('.image-layer img');
            if (!img || !img.naturalWidth || !img.naturalHeight) {
                return false;
            }
            const imgW = img.naturalWidth;
            const imgH = img.naturalHeight;
            const targetPixels = 750 * 750;
            const currentPixels = imgW * imgH;
            const scale = Math.sqrt(targetPixels / currentPixels);
            const zoomW = imgW * scale;
            const zoomH = imgH * scale;
            promptItem.style.setProperty('--zoom-width', zoomW + 'px');
            promptItem.style.setProperty('--zoom-height', zoomH + 'px');
            return true;
        }
        
        // 调整zoom-view位置，避免碰到浏览器边框
        function adjustZoomViewPosition(promptItem) {
            const rect = promptItem.getBoundingClientRect();
            const zoomW = parseFloat(getComputedStyle(promptItem).width) || rect.width;
            const zoomH = parseFloat(getComputedStyle(promptItem).height) || rect.height;
            const margin = 20; // 距离浏览器边框的最小间距
            
            let offsetX = 0;
            let offsetY = 0;
            
            // 检查右边缘
            if (rect.left + zoomW > window.innerWidth - margin) {
                offsetX = window.innerWidth - margin - zoomW - rect.left;
            }
            // 检查左边缘
            if (rect.left + offsetX < margin) {
                offsetX = margin - rect.left;
            }
            // 检查下边缘
            if (rect.top + zoomH > window.innerHeight - margin) {
                offsetY = window.innerHeight - margin - zoomH - rect.top;
            }
            // 检查上边缘
            if (rect.top + offsetY < margin) {
                offsetY = margin - rect.top;
            }
            
            if (offsetX !== 0 || offsetY !== 0) {
                promptItem.style.setProperty('--zoom-offset-x', offsetX + 'px');
                promptItem.style.setProperty('--zoom-offset-y', offsetY + 'px');
            } else {
                promptItem.style.removeProperty('--zoom-offset-x');
                promptItem.style.removeProperty('--zoom-offset-y');
            }
        }
        
        document.addEventListener('mouseover', (e) => {
            // 如果正在拖拽，直接跳过
            if (isDragging) {
                return;
            }
            
            // 如果有 modal 打开，不触发 zoom-view
            if (document.querySelector('.modal.visible')) {
                return;
            }
            
            // 如果鼠标在 actions、action-btn、drag-handle 上，不触发 zoom-view
            if (e.target.closest('.actions, .action-btn, .drag-handle, .selected-card-delete')) {
                return;
            }
            
            const promptItem = e.target.closest('.prompt-item:not(.add-prompt-btn)');
            if (promptItem) {
                // 检查是否有预览图
                const hasPreview = setZoomViewSize(promptItem);
                if (!hasPreview) {
                    return;
                }
                
                // 清除离开计时器
                clearTimeout(leaveTimer);
                leaveTimer = null;
                
                if (currentZoomItem !== promptItem) {
                    if (currentZoomItem) {
                        currentZoomItem.classList.remove('zoom-view');
                    }
                    clearTimeout(zoomTimer);
                    currentZoomItem = promptItem;
                    zoomTimer = setTimeout(() => {
                        if (currentZoomItem === promptItem && !isDragging) {
                            if (document.querySelector('.modal.visible')) return;
                            promptItem.classList.add('zoom-view');
                            adjustZoomViewPosition(promptItem);
                        }
                    }, 2000);
                }
            }
        });
        
        document.addEventListener('mouseout', (e) => {
            // 如果正在拖拽，直接跳过
            if (isDragging) {
                return;
            }
            
            const promptItem = e.target.closest('.prompt-item:not(.add-prompt-btn)');
            if (promptItem && currentZoomItem === promptItem) {
                // 检查是否真的离开了wrapper，还是只是在内部元素间移动
                const wrapper = promptItem.closest('.prompt-item-wrapper');
                if (wrapper) {
                    const rect = wrapper.getBoundingClientRect();
                    const isStillOver = e.clientX >= rect.left && e.clientX <= rect.right &&
                                       e.clientY >= rect.top && e.clientY <= rect.bottom;
                    
                    if (isStillOver) {
                        // 还在wrapper内，不做处理
                        return;
                    }
                }
                
                // 延迟一点时间再移除，防止抖动
                clearTimeout(leaveTimer);
                leaveTimer = setTimeout(() => {
                    clearTimeout(zoomTimer);
                    // 先添加zoom-exit类，使用绝对定位回缩，避免影响布局
                    promptItem.classList.remove('zoom-view');
                    promptItem.classList.add('zoom-exit');
                    currentZoomItem = null;
                    
                    // 等待transition动画完成后移除zoom-exit
                    const onTransitionEnd = (e) => {
                        if (e.propertyName === 'width' || e.propertyName === 'height') {
                            promptItem.classList.remove('zoom-exit');
                            promptItem.removeEventListener('transitionend', onTransitionEnd);
                        }
                    };
                    promptItem.addEventListener('transitionend', onTransitionEnd);
                    
                    // 保险：如果transition事件没有触发，300ms后强制移除
                    setTimeout(() => {
                        promptItem.classList.remove('zoom-exit');
                        promptItem.removeEventListener('transitionend', onTransitionEnd);
                    }, 350);
                }, 100);
            }
        });
        
        // 事件委托处理提示词卡片点击
        document.addEventListener('click', (e) => {
            // 处理 drag-handle 点击（拖拽）- 不做任何事
            const dragHandle = e.target.closest('.drag-handle');
            if (dragHandle) {
                e.stopPropagation();
                return;
            }

            // 处理 select-area 点击（选择提示词）
            const selectArea = e.target.closest('.select-area');
            if (selectArea) {
                const promptItem = selectArea.closest('.prompt-item');
                if (promptItem && promptItem.dataset.prompt) {
                    const wasZoomed = promptItem.classList.contains('zoom-view');
                    const clickedPrompt = promptItem.dataset.prompt;
                    togglePrompt(clickedPrompt);
                    if (wasZoomed) {
                        clearTimeout(zoomTimer);
                        clearTimeout(leaveTimer);
                        zoomTimer = null;
                        leaveTimer = null;
                        requestAnimationFrame(() => {
                            const items = document.querySelectorAll('.prompt-item[data-prompt]');
                            for (const item of items) {
                                if (item.dataset.prompt === clickedPrompt) {
                                    if (setZoomViewSize(item)) {
                                        currentZoomItem = item;
                                        item.classList.add('zoom-view');
                                        adjustZoomViewPosition(item);
                                    }
                                    break;
                                }
                            }
                        });
                    }
                }
                return;
            }
            
            // 处理 action 按钮点击
            const actionBtn = e.target.closest('.action-btn');
            if (actionBtn) {
                e.stopPropagation();
                const action = actionBtn.dataset.action;
                const id = actionBtn.dataset.id;
                const category = actionBtn.dataset.category;
                
                if (action === 'edit') {
                    openEditModal(id, category);
                } else if (action === 'delete') {
                    deletePrompt(id);
                }
                return;
            }
            
            // 处理添加提示词按钮点击（跳过 prefab 的 +Add Prefab）
            const addBtn = e.target.closest('.add-prompt-btn');
            if (addBtn && addBtn.dataset.category) {
                openAddModal(addBtn.dataset.category);
                return;
            }
        });

        // 展开状态的类别背景图片跟随鼠标移动 + 随机晃动
        let lastMouseX = 0;
        let lastMouseY = 0;
        
        // 平滑随机晃动的状态
        const shakeState = {
            offsetX: 0,
            offsetY: 0,
            targetX: 0,
            targetY: 0,
            lastTime: Date.now()
        };
        
        document.addEventListener('mousemove', (e) => {
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });
        
        // 动画循环 - 结合鼠标移动和平滑随机晃动
        function animateBackground() {
            const now = Date.now();
            const deltaTime = (now - shakeState.lastTime) / 1000;
            shakeState.lastTime = now;
            
            // 更新随机目标位置
            if (Math.random() < 0.02) {
                shakeState.targetX = (Math.random() - 0.5) * 4;
                shakeState.targetY = (Math.random() - 0.5) * 4;
            }
            
            // 平滑过渡到目标位置
            const lerpFactor = 0.05;
            shakeState.offsetX += (shakeState.targetX - shakeState.offsetX) * lerpFactor;
            shakeState.offsetY += (shakeState.targetY - shakeState.offsetY) * lerpFactor;
            
            const bgMasks = document.querySelectorAll('.category-background-mask');
            bgMasks.forEach(mask => {
                const category = mask.closest('.category');
                if (!category) return;
                
                const rect = category.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const deltaX = (lastMouseX - centerX) / rect.width;
                const deltaY = (lastMouseY - centerY) / rect.height;
                
                // 找到内部的背景图元素并设置变换
                const bg = mask.querySelector('.category-background');
                if (!bg) return;
                
                // 计算背景图与mask的尺寸差
                const maskW = mask.offsetWidth;
                const maskH = mask.offsetHeight;
                const bgW = parseFloat(getComputedStyle(bg).width) || maskW * 1.2;
                const bgH = parseFloat(getComputedStyle(bg).height) || maskH * 1.2;
                
                const maxMoveX = Math.max(0, (bgW - maskW) * 0.5);
                const maxMoveY = Math.max(0, (bgH - maskH) * 0.5);
                
                // 鼠标移动系数，降低移动幅度（0.1 = 10%的移动量）
                const mouseSensitivity = 0.05;
                
                // 目标位置（无限制时）
                const targetX = deltaX * maxMoveX * mouseSensitivity + shakeState.offsetX;
                const targetY = deltaY * maxMoveY * mouseSensitivity + shakeState.offsetY;
                
                // 边缘衰减函数：越接近边缘，移动越慢，在边缘处速度降为0
                function applyEdgeDecay(value, maxValue) {
                    if (maxValue <= 0) return 0;
                    const ratio = value / maxValue;
                    const decayedRatio = Math.tanh(ratio);
                    return decayedRatio * maxValue;
                }
                
                const totalX = applyEdgeDecay(targetX, maxMoveX);
                const totalY = applyEdgeDecay(targetY, maxMoveY);

                // 叠加焦点 base offset
                const catEl = mask.closest('.category');
                const catName = catEl ? catEl.id.replace('category-', '') : '';
                const base = categoryFocusBase[catName];
                const finalX = base ? totalX + base.x : totalX;
                const finalY = base ? totalY + base.y : totalY;

                bg.style.setProperty('--bg-x', `${finalX}px`);
                bg.style.setProperty('--bg-y', `${finalY}px`);
            });
            
            requestAnimationFrame(animateBackground);
        }
        
        // 启动动画循环
        requestAnimationFrame(animateBackground);
        
        // 当类别折叠时，重置背景位置
        const observer = new MutationObserver((mutations) => {
            mutations.forEach(mutation => {
                if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                    const category = mutation.target;
                    if (category.classList.contains('category') && !category.classList.contains('expanded')) {
                        category.style.removeProperty('--bg-x');
                        category.style.removeProperty('--bg-y');
                    }
                }
            });
        });
        
        // 观察categories-container的子元素变化，确保新添加的category也被观察
        const containerObserver = new MutationObserver((mutations) => {
            mutations.forEach(mutation => {
                if (mutation.addedNodes) {
                    mutation.addedNodes.forEach(node => {
                        if (node.classList && node.classList.contains('category')) {
                            observer.observe(node, { attributes: true });
                        }
                    });
                }
            });
        });

        window.mergePrefab = mergePrefab;
        window.replacePrefab = replacePrefab;
        window.openAddPrefabModal = openAddPrefabModal;
        window.closeAddPrefabModal = closeAddPrefabModal;
        window.addPrefab = addPrefab;
        window.openEditPrefabModal = openEditPrefabModal;
        window.closeEditPrefabModal = closeEditPrefabModal;
        window.updatePrefab = updatePrefab;
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            // 监听所有现有类别的class变化
            document.querySelectorAll('.category').forEach(category => {
                observer.observe(category, { attributes: true });
            });
            // 观察容器，监听新添加的category
            const container = document.getElementById('categories');
            if (container) {
                containerObserver.observe(container, { childList: true, subtree: true });
            }
            
            // ResizeObserver 监听背景图mask尺寸变化，重新计算缩放
            const bgResizeObserver = new ResizeObserver((entries) => {
                entries.forEach(entry => {
                    const mask = entry.target;
                    const bg = mask.querySelector('.category-background');
                    if (bg) {
                        const bgImage = bg.style.backgroundImage;
                        const match = bgImage.match(/url\(["']?\/images\/([^"')]+)["']?\)/);
                        if (match && match[1]) {
                            const catEl = mask.closest('.category');
                            const catName = catEl ? catEl.id.replace('category-', '') : '';
                            setBackgroundScale(bg, `/images/${match[1]}`, catName);
                        }
                    }
                });
            });
            
            // 监听所有现有的背景图mask
            document.querySelectorAll('.category-background-mask').forEach(mask => {
                bgResizeObserver.observe(mask);
            });
            
            // 通过容器观察器监听新添加的背景图mask
            const bgMaskObserver = new MutationObserver((mutations) => {
                mutations.forEach(mutation => {
                    if (mutation.addedNodes) {
                        mutation.addedNodes.forEach(node => {
                            if (node.classList && node.classList.contains('category-background-mask')) {
                                bgResizeObserver.observe(node);
                            }
                            if (node.querySelectorAll) {
                                node.querySelectorAll('.category-background-mask').forEach(mask => {
                                    bgResizeObserver.observe(mask);
                                });
                            }
                        });
                    }
                });
            });
            
            if (container) {
                bgMaskObserver.observe(container, { childList: true, subtree: true });
            }
        });
    </script>
</body>
</html>
