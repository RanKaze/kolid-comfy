<script>
/* Kolid Desktop(跨源 iframe 页签):window.close() 是 no-op,转发给宿主壳页关页签;
   宿主点页签 × 时发来 {__kolid:'pageClose'},补一次 beforeunload 让本页的通知照常发出。
   独立在普通浏览器里打开时(window.parent===window)整段不生效。 */
(function () {
  if (window.parent === window) return;
  window.close = function () {
    try { window.top.postMessage({ __kolid: 'closeTab' }, '*'); } catch (e) {}
  };
  window.addEventListener('message', function (e) {
    if (e.data && e.data.__kolid === 'pageClose') {
      try { window.dispatchEvent(new Event('beforeunload')); } catch (err) {}
    }
  });
})();
</script>

  strength: number;
  source: 'normal' | 'parsing' | 'program';
}

interface Lora {
  file_path: string;
  name: string;
  strength: number;
  active_tags: string[];
  active: boolean;
  split_mode?: boolean;
}

interface PrefabTagState {
  key: string;
  active: boolean;
}

interface PrefabLoraState {
  file_path: string;
  active: boolean;
}

interface Prefab {
  guid: string;
  active: boolean;
  name: string;
  tag_groups: TagGroup[];
  loras: Lora[];
  custom_prompts: string;
  preview: string;
  tag_states: PrefabTagState[];
  lora_states: PrefabLoraState[];
  children: Prefab[];
}

  name: string;
  prompt: string;
  category: string;
  tags: string[];
}

interface PromptData {
  id: string;
  name: string;
  prompt: string;
  preview?: string;
  tags?: string[];
}

interface PromptsData {
  [category: string]: {
    bg_image?: string;
    bg_video?: string;
    tags?: string[];
    prompts?: PromptData[];
  };
}

/** Selected prefabs (merged: selection state + tag/lora data from prefab definitions). */
declare const prefabs: Prefab[];

/** Free-form custom prompt text entered by the user. */
declare const custom_prompts: string;

/** Full prompt library data, organized by category. */

/** Lookup table: prompt text → metadata (tags). */

/** Prefab context injected from the root program's context selections. */
declare const prefab_context: Prefab[];

/** Lora context injected from the root program's context selections. */
declare const lora_context: Lora[];

/** Prompt context injected from the root program's context selections. */

  filter_tag_groups?: TagGroup[];
  /** Loras to remove from selection. */
  filter_loras?: Lora[];
  /** Prefabs to remove from selection. */
  filter_prefabs?: Prefab[];
  /** New tag groups to add. */
  gen_tag_groups?: TagGroup[];
  /** New loras to add. */
  gen_loras?: Lora[];
  /** New prefabs to add. */
  gen_prefabs?: Prefab[];
  /** Replacement custom prompt text. */
  custom_prompts?: string;
}
