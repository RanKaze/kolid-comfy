  name: string;
  strength: number;
  active_tags: string[];
  active: boolean;
  split_mode?: boolean;
}

  key: string;
  active: boolean;
}

interface PrefabLoraState {
  file_path: string;
  active: boolean;
}

  guid: string;
  active: boolean;
  name: string;
  tag_groups: TagGroup[];
  loras: Lora[];
  custom_prompts: string;

}

  filter_prefabs?: Prefab[];
  /** New tag groups to add. */
  gen_tag_groups?: TagGroup[];
  /** New loras to add. */
