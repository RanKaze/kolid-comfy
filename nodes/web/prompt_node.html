    <div class="modal" id="decorationModal">
        <div class="modal-content" style="max-width: 95vw; width: 1400px; max-height: 90vh; display: flex; flex-direction: column;">
            <h2 id="decorationModalTitle">Select Decoration</h2>
            <div id="decorationSelectedTags" style="margin-bottom: 8px;"></div>
            <div id="decorationPromptsList" style="flex: 1; overflow-y: auto; margin: 12px 0;"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeDecorationModal()">Cancel</button>
                <button class="btn btn-primary" onclick="finishDecorationSelection()">Finish</button>
            </div>
        </div>
    </div>

    <script>
        let allPrompts = {};
        let selectedPrompts = [];
        let lastSelected = [];
        let expandedCategories = new Set();
        let searchQuery = '';

        // ==================== 新增：临时上下文相关变量（支持嵌套） ====================
        let temporaryContextStack = [];  // 栈：每一层 {matchFn, basePrompt, title, selectedPrompts}
        
        function isTemporaryContext() {
            return temporaryContextStack.length > 0;
        }
        
        function getCurrentTemporaryContext() {
            return temporaryContextStack.length > 0 ? temporaryContextStack[temporaryContextStack.length - 1] : null;
        }

        let categoryDisplayModes = {};
        let categorySizeModes = {};
        let promptFoldout = false;
        let currentDecorationTarget = null;
        let currentDecorationSelections = [];

        function updateFooterButton() {
            const confirmBtn = document.querySelector('.footer .btn-primary');
            if (!confirmBtn) return;

            if (isTemporaryContext()) {
                confirmBtn.textContent = 'Select';
                confirmBtn.style.background = '#28a745';
                confirmBtn.style.borderColor = '#28a745';
                confirmBtn.onclick = endTemporaryContext;
            } else {
                confirmBtn.textContent = 'Confirm';
                confirmBtn.style.background = '';
                confirmBtn.style.borderColor = '';
                confirmBtn.onclick = confirmSelection;
            }
        }

        function beginTemporaryContext(matchFn, basePrompt, title = "正在选择装饰提示词") {
            // 保存当前状态到栈中（如果已经在临时上下文中）
            if (temporaryContextStack.length > 0) {
                const currentCtx = getCurrentTemporaryContext();
                currentCtx.selectedPrompts = [...temporarySelectedPrompts];
            }
            
            // 保存当前展开的类别状态
            const currentExpanded = new Set(expandedCategories);
            
            // 创建新的临时上下文层
            temporaryContextStack.push({
                matchFn: matchFn,
                basePrompt: basePrompt,
                title: title,
                selectedPrompts: [],
                originalExpandedCategories: currentExpanded,
                level: temporaryContextStack.length + 1 // 保存当前嵌套层数
            });
            
            // 初始化当前层的状态
            temporarySelectedPrompts = [];
            expandedCategories.clear();

            renderCategories();
            initDragEvents();
            updateFooterButton();
            showTemporaryBanner();

            console.log(`✅ 进入临时模式 (第${temporaryContextStack.length}层): ${title}`);
        }

        // 根据层数生成对应数量的方括号
        function wrapWithBrackets(text, level) {
            const brackets = '['.repeat(level);
            const closingBrackets = ']'.repeat(level);
            return `${brackets}${text}${closingBrackets}`;
        }

        // 递归组合提示词和它的装饰词，使用正确的层级信息
        function combinePromptWithDecorations(promptObj) {
            // 如果没有装饰词，直接返回带正确括号的提示词
            if (!promptObj.decorations || promptObj.decorations.length === 0) {
                return wrapWithBrackets(promptObj.text, promptObj.level);
            }
            
            // 递归组合所有装饰词
            let result = '';
            for (const deco of promptObj.decorations) {
                result += combinePromptWithDecorations(deco) + ' ';
            }
            
            // 添加当前层级的提示词
            result += wrapWithBrackets(promptObj.text, promptObj.level);
            return result;
        }

        // 最终组合所有内容，基础提示词不带括号
        function combineAll(basePrompt, decorations, baseLevel) {
            let result = '';
            
            // 先组合所有装饰词
            for (const deco of decorations) {
                result += combinePromptWithDecorations(deco) + ' ';
            }
            
            // 添加基础提示词（不带括号）
            result += basePrompt;
            return result;
        }

        // 检查一个字符串是否是装饰提示对象（有text和level属性）
        function isDecorationObject(obj) {
            return typeof obj === 'object' && obj !== null && 'text' in obj && 'level' in obj;
        }

        function addBasePromptOnly() {
            if (temporaryContextStack.length === 0) return;
            
            const ctx = temporaryContextStack.pop();
            
            // 处理当前层的选择 - 新选择的修饰词层级是当前层级
            const processedSelections = [];
            for (const p of temporarySelectedPrompts) {
                if (isDecorationObject(p)) {
                    // 已经是装饰对象，直接使用
                    processedSelections.push(p);
                } else {
                    // 查找对应的name
                    const promptData = findPromptData(p);
                    const name = promptData ? promptData.name : '';
                    // 创建新的装饰对象
                    processedSelections.push({
                        text: p,
                        name: name,
                        level: ctx.level,
                        decorations: []
                    });
                }
            }
            
            // basePrompt 作为修饰词时的层级应该是当前层级减1
            const basePromptLevel = Math.max(1, ctx.level - 1);
            
            // 恢复上一层状态或正常状态
            if (temporaryContextStack.length > 0) {
                // 有上一层，将当前层选择的对象传递给上一层
                const prevCtx = getCurrentTemporaryContext();
                temporarySelectedPrompts = prevCtx.selectedPrompts || [];
                
                // 查找上一层中是否已经有与当前 basePrompt 匹配的选择
                let found = false;
                for (let i = 0; i < temporarySelectedPrompts.length; i++) {
                    const item = temporarySelectedPrompts[i];
                    if (isDecorationObject(item) && item.text === ctx.basePrompt) {
                        // 找到匹配项，将当前选择添加为它的装饰
                        item.decorations = item.decorations || [];
                        item.decorations.push(...processedSelections);
                        found = true;
                        break;
                    }
                }
                
                if (!found) {
                    // 查找 basePrompt 对应的 name
                    const basePromptData = findPromptData(ctx.basePrompt);
                    const basePromptName = basePromptData ? basePromptData.name : '';
                    // 没找到匹配项，创建新的装饰对象，basePrompt 层级减1
                    temporarySelectedPrompts.push({
                        text: ctx.basePrompt,
                        name: basePromptName,
                        level: basePromptLevel,
                        decorations: processedSelections
                    });
                }
                
                expandedCategories = new Set(prevCtx.originalExpandedCategories);
                showTemporaryBanner();
            } else {
                // 查找 basePrompt 对应的 name
                const basePromptData = findPromptData(ctx.basePrompt);
                const basePromptName = basePromptData ? basePromptData.name : '';
                // 没有上一层，最终组合并添加到最终选择列表
                const finalCombined = combineAll(ctx.basePrompt, processedSelections, basePromptLevel);
                // 创建装饰对象以便显示时包含 name
                const finalObj = {
                    text: ctx.basePrompt,
                    name: basePromptName,
                    level: basePromptLevel,
                    decorations: processedSelections
                };
                selectedPrompts.push(finalObj);
                temporarySelectedPrompts = [];
                expandedCategories = new Set(ctx.originalExpandedCategories);
                hideTemporaryBanner();
            }
            
            renderCategories();
            updateSelectedTags();
            updateFooterButton();
            
            console.log("✅ 直接添加基础提示词");
        }

        function endTemporaryContext() {
            if (temporaryContextStack.length === 0) return;
            
            const ctx = temporaryContextStack.pop();
            
            // 处理当前层的选择 - 新选择的修饰词层级是当前层级
            const processedSelections = [];
            for (const p of temporarySelectedPrompts) {
                if (isDecorationObject(p)) {
                    // 已经是装饰对象，直接使用
                    processedSelections.push(p);
                } else {
                    // 查找对应的name
                    const promptData = findPromptData(p);
                    const name = promptData ? promptData.name : '';
                    // 创建新的装饰对象
                    processedSelections.push({
                        text: p,
                        name: name,
                        level: ctx.level,
                        decorations: []
                    });
                }
            }
            
            // basePrompt 作为修饰词时的层级应该是当前层级减1
            const basePromptLevel = Math.max(1, ctx.level - 1);
            
            // 恢复上一层状态或正常状态
            if (temporaryContextStack.length > 0) {
                // 有上一层，将当前层选择的对象传递给上一层
                const prevCtx = getCurrentTemporaryContext();
                temporarySelectedPrompts = prevCtx.selectedPrompts || [];
                
                // 查找上一层中是否已经有与当前 basePrompt 匹配的选择
                let found = false;
                for (let i = 0; i < temporarySelectedPrompts.length; i++) {
                    const item = temporarySelectedPrompts[i];
                    if (isDecorationObject(item) && item.text === ctx.basePrompt) {
                        // 找到匹配项，将当前选择添加为它的装饰
                        item.decorations = item.decorations || [];
                        item.decorations.push(...processedSelections);
                        found = true;
                        break;
                    }
                }
                
                if (!found && (processedSelections.length > 0 || temporarySelectedPrompts.length === 0)) {
                    // 查找 basePrompt 对应的 name
                    const basePromptData = findPromptData(ctx.basePrompt);
                    const basePromptName = basePromptData ? basePromptData.name : '';
                    // 没找到匹配项，创建新的装饰对象，basePrompt 层级减1
                    temporarySelectedPrompts.push({
                        text: ctx.basePrompt,
                        name: basePromptName,
                        level: basePromptLevel,
                        decorations: processedSelections
                    });
                }
                
                expandedCategories = new Set(prevCtx.originalExpandedCategories);
                showTemporaryBanner();
            } else {
                // 查找 basePrompt 对应的 name
                const basePromptData = findPromptData(ctx.basePrompt);
                const basePromptName = basePromptData ? basePromptData.name : '';
                // 没有上一层，最终组合并添加到最终选择列表
                if (processedSelections.length > 0 || temporarySelectedPrompts.length === 0) {
                    // 创建装饰对象以便显示时包含 name
                    const finalObj = {
                        text: ctx.basePrompt,
                        name: basePromptName,
                        level: basePromptLevel,
                        decorations: processedSelections
                    };
                    selectedPrompts.push(finalObj);
                }
                temporarySelectedPrompts = [];
                expandedCategories = new Set(ctx.originalExpandedCategories);
                hideTemporaryBanner();
            }
            
            renderCategories();
            updateSelectedTags();
            updateFooterButton();
            
            console.log("✅ 完成临时上下文选择");
        }

        function showTemporaryBanner() {
            const banner = document.getElementById('temporaryBanner');
            const textEl = document.getElementById('bannerText');
            const backBtn = document.getElementById('backBtn');
            const ctx = getCurrentTemporaryContext();
            
            if (banner && textEl && ctx) {
                const level = temporaryContextStack.length;
                textEl.textContent = `[${level}层] ${ctx.title}`;
                backBtn.style.display = level > 1 ? 'inline-block' : 'none';
                banner.classList.remove('hidden');
            }
        }

        function hideTemporaryBanner() {
            const banner = document.getElementById('temporaryBanner');
            if (banner) {
                banner.classList.add('hidden');
            }
        }

        function setBackgroundScale(bgContainer, bgImagePath) {
            const img = new Image();
            img.onload = function() {
                const maskWidth = bgContainer.parentElement.offsetWidth;
                const maskHeight = bgContainer.parentElement.offsetHeight;
                const imageWidth = img.naturalWidth;
                const imageHeight = img.naturalHeight;
                if (imageWidth > 0 && imageHeight > 0 && maskWidth > 0 && maskHeight > 0) {
                    const scale = Math.max(
                        (maskWidth * 1.2) / imageWidth,
                        (maskHeight * 1.2) / imageHeight
                    );
                    const bgWidth = imageWidth * scale;
                    const bgHeight = imageHeight * scale;
                    bgContainer.style.setProperty('--bg-width', bgWidth + 'px');
                    bgContainer.style.setProperty('--bg-height', bgHeight + 'px');
                }
            };
            img.src = bgImagePath;
        }

        async function loadData() {
            try {
                const res = await fetch('/prompts_data');
                const data = await res.json();
                allPrompts = data.categories;
                lastSelected = data.last_selected || [];
                promptFoldout = data.prompt_foldout || false;
                
                categoryDisplayModes = data.category_display_modes || {};
                categorySizeModes = data.category_size_modes || {};

                selectedPrompts = [...lastSelected];
                updateSelectedTags();
                
                // 加载自定义输入内容
                const customPrompts = data.custom_prompts || '';
                document.getElementById('customPromptInput').value = customPrompts;
                
                if (promptFoldout) {
                    for (const [category, catData] of Object.entries(allPrompts)) {
                        const prompts = catData.prompts || catData;
                        if (prompts.some(p => lastSelected.includes(p.prompt))) {
                            expandedCategories.add(category);
                        }
                    }
                }
                
                renderCategories();
                initDragEvents();
                updateFooterButton();
            } catch (e) {
                console.error('Failed to load data', e);
            }
        }

        function renderCategories() {
            const container = document.getElementById('categories');
            container.innerHTML = '';

            for (const [category, catData] of Object.entries(allPrompts)) {
                let prompts = catData.prompts || catData;
                const bgImage = catData.bg_image || '';

                let filteredPrompts = prompts;

                const ctx = getCurrentTemporaryContext();
                if (ctx && ctx.matchFn) {
                    filteredPrompts = prompts.filter(p => ctx.matchFn(p, category));
                } else if (searchQuery) {
                    filteredPrompts = prompts.filter(p => {
                        const tagsMatch = Array.isArray(p.tags) 
                            ? p.tags.some(t => t.toLowerCase().includes(searchQuery))
                            : (p.tags || '').toLowerCase().includes(searchQuery);
                        return p.name.toLowerCase().includes(searchQuery) || 
                            p.prompt.toLowerCase().includes(searchQuery) || tagsMatch;
                    });
                }

                if ((searchQuery || isTemporaryContext()) && filteredPrompts.length === 0) {
                    continue;
                }

                const isExpanded = expandedCategories.has(category);

                const categoryDiv = document.createElement('div');
                categoryDiv.className = `category ${isExpanded ? 'expanded' : 'collapsed'}`;
                categoryDiv.id = `category-${category}`;

                const displayMode = categoryDisplayModes[category] || 'horizontal';
                const sizeMode = categorySizeModes[category] || 'normal';

                const selectedCount = getCategorySelectedCount(category, prompts);
                
                const catDecorations = Array.isArray(catData.decorations) ? catData.decorations : [];
                const catDecoTagsHtml = catDecorations.length > 0 ? `
                    <div class="decoration-tags">
                        ${catDecorations.map(d => `<span class="decoration-tag">${d}</span>`).join('')}
                    </div>
                ` : '';

                // 创建背景图遮罩容器（包含背景图）
                const bgHtml = isExpanded && bgImage 
                    ? `<div class="category-background-mask"><div class="category-background" style="background-image: url(/images/${bgImage})"></div></div>` 
                    : '';
                
                // 折叠状态下的header背景图
                const headerBgHtml = !isExpanded && bgImage 
                    ? `<img src="/images/${bgImage}" class="bg-image" alt="">` 
                    : '';

                categoryDiv.innerHTML = `
                    ${bgHtml}
                    <div class="category-header" onclick="toggleCategory('${category}')">
                        ${headerBgHtml}
                        <div class="header-content">
                            <div style="display: flex; align-items: center;">
                                <span class="drag-handle" data-drag-type="category" data-category="${category}">⋮⋮</span>
                                <span style="text-shadow: 0px 0px 4px black;">${category}</span>
                            </div>
                            <div style="display: flex; align-items: center;">
                                ${catDecoTagsHtml}
                                ${selectedCount > 0 ? `<span class="count-badge">${selectedCount}</span>` : ''}
                                <button class="display-mode-btn" onclick="event.stopPropagation(); openEditDisplayModeModal('${category}')">⊞</button>
                                <button class="edit-category-btn" onclick="event.stopPropagation(); openEditCategoryModal('${category}')">✏️</button>
                                <span class="toggle">${isExpanded ? '▲' : '▼'}</span>
                            </div>
                        </div>
                    </div>
                `;

                if (isExpanded) {
                    const contentDiv = document.createElement('div');
                    contentDiv.className = `category-content ${displayMode === 'box' ? 'box-mode' : ''} ${categorySizeModes[category] === 'mini' ? 'mini-mode' : ''}`;
                    contentDiv.id = `cat-${category}`;
                    
                    const isMiniMode = categorySizeModes[category] === 'mini';
                    const modeClass = isMiniMode ? 'mini-mode' : 'normal-mode';
                    
                    // 添加提示词
                    for (const p of filteredPrompts) {
                        const pDecorations = Array.isArray(p.decorations) ? p.decorations : [];
                        const uniquePDecorations = pDecorations.filter(d => !catDecorations.includes(d));
                        const decoTagsHtml = uniquePDecorations.length > 0 ? `
                            <div class="decoration-tags">
                                ${uniquePDecorations.map(d => `<span class="decoration-tag">${d}</span>`).join('')}
                            </div>
                        ` : '';
                        
                        let isSelected = false;
                        if (isTemporaryContext()) {
                            isSelected = temporarySelectedPrompts.includes(p.prompt);
                            if (!isSelected) {
                                for (const item of temporarySelectedPrompts) {
                                    if (isDecorationObject(item) && item.text === p.prompt) {
                                        isSelected = true;
                                        break;
                                    }
                                }
                            }
                        } else {
                            isSelected = isBasePromptSelected(p.prompt);
                        }
                        
                        const combos = getPromptCombinations(p.prompt);
                        let selectedCardsHtml = '';
                        for (const combo of combos) {
                            const escapedCombo = combo.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                            selectedCardsHtml += `
                                <div class="selected-card" data-prompt="${escapedCombo}">
                                    <div class="selected-card-content">${combo}</div>
                                    <button class="selected-card-delete" onclick="deleteSelectedPrompt(event, '${escapedCombo}')">×</button>
                                </div>
                            `;
                        }
                        
                        const wrapperDiv = document.createElement('div');
                        wrapperDiv.className = 'prompt-item-wrapper';
                        wrapperDiv.innerHTML = `
                            <div class="prompt-item ${modeClass} ${isSelected ? 'selected' : ''}"
                                data-prompt="${p.prompt}" data-id="${p.id}" data-category="${category}">
                                <span class="drag-handle" data-drag-type="prompt" data-id="${p.id}" data-category="${category}">⋮⋮</span>
                                ${decoTagsHtml}
                                <div class="select-area">
                                    <div class="image-layer">
                                        ${p.preview ? `<img src="/images/${p.preview}" alt="${p.name}" loading="lazy">` : '<div class="no-image">No Image</div>'}
                                    </div>
                                    ${!isMiniMode ? '<div class="glass-layer"></div>' : ''}
                                    <div class="text-layer">
                                        <div class="name">${p.name}</div>
                                        <div class="prompt-text">${p.prompt}</div>
                                    </div>
                                </div>
                                <div class="actions">
                                    <button class="action-btn edit" data-action="edit" data-id="${p.id}" data-category="${category}">✏️</button>
                                    <button class="action-btn delete" data-action="delete" data-id="${p.id}">🗑️</button>
                                </div>
                            </div>
                            ${selectedCardsHtml}
                        `;
                        contentDiv.appendChild(wrapperDiv);
                    }
                    
                    // 添加prompt按钮
            if (!searchQuery) {
                const addBtnDiv = document.createElement('div');
                addBtnDiv.className = `prompt-item add-prompt-btn ${modeClass}`;
                addBtnDiv.dataset.category = category;
                addBtnDiv.innerHTML = `<div>+</div>`;
                contentDiv.appendChild(addBtnDiv);
            }
                    
                    categoryDiv.appendChild(contentDiv);
                }
                container.appendChild(categoryDiv);
                
                // 设置背景图缩放比例
                if (isExpanded && bgImage) {
                    const bgContainer = categoryDiv.querySelector('.category-background');
                    if (bgContainer) {
                        setBackgroundScale(bgContainer, `/images/${bgImage}`);
                    }
                }
            }

            // 临时模式下隐藏添加类别卡片
            if (!isTemporaryContext()) {
                const addDiv = document.createElement('div');
                addDiv.className = 'add-category-card';
                addDiv.onclick = openAddCategoryModal;
                addDiv.innerHTML = '<span>+ Add Category</span>';
                container.appendChild(addDiv);
            }

            initDragEvents();
        }

        function getCategorySelectedCount(category, prompts) {
            if (isTemporaryContext()) {
                // 在临时模式下，检查 prompt 是否被选中（可以是字符串或对象）
                return prompts.filter(p => {
                    // 先检查是否是直接的字符串匹配
                    if (temporarySelectedPrompts.includes(p.prompt)) return true;
                    // 再检查是否是装饰对象匹配
                    for (const item of temporarySelectedPrompts) {
                        if (isDecorationObject(item) && item.text === p.prompt) {
                            return true;
                        }
                    }
                    return false;
                }).length;
            }
            return prompts.filter(p => isBasePromptSelected(p.prompt)).length;
        }


        function toggleCategory(category) {
            const categoryDiv = document.getElementById(`category-${category}`);
            const isExpanded = expandedCategories.has(category);
            const catData = allPrompts[category] || {};
            const bgImage = catData.bg_image || '';
            
            if (isExpanded) {
                // 折叠：直接移除内容，不使用动画
                expandedCategories.delete(category);
                categoryDiv.classList.remove('expanded');
                categoryDiv.classList.add('collapsed');
                
                // 移除背景图遮罩容器
                const bgMask = categoryDiv.querySelector('.category-background-mask');
                if (bgMask) {
                    bgMask.remove();
                }
                
                const content = document.getElementById(`cat-${category}`);
                if (content) {
                    content.remove();
                }
                
                // 重新渲染 header 以恢复折叠状态的背景图
                const header = categoryDiv.querySelector('.category-header');
                if (header && bgImage) {
                    // 检查是否已有 bg-image，没有则添加
                    if (!header.querySelector('.bg-image')) {
                        const img = document.createElement('img');
                        img.src = `/images/${bgImage}`;
                        img.className = 'bg-image';
                        img.alt = '';
                        header.insertBefore(img, header.firstChild);
                    }
                }
            } else {
                // 展开：只在这个卡片上添加动画
                expandedCategories.add(category);
                categoryDiv.classList.remove('collapsed');
                categoryDiv.classList.add('expanded');
                
                // 创建背景图遮罩容器（包含背景图）
                if (bgImage) {
                    const bgMask = document.createElement('div');
                    bgMask.className = 'category-background-mask';
                    
                    const bgContainer = document.createElement('div');
                    bgContainer.className = 'category-background';

                contentDiv.addEventListener('animationend', () => {

            // 更新箭头

        // ==================== 修复后的 togglePrompt（支持嵌套临时上下文） ====================
        function togglePrompt(prompt) {
            // 情况1：临时模式下选择装饰
            if (isTemporaryContext()) {
                const ctx = getCurrentTemporaryContext();
                
                // 检查被点击的提示词是否也有可用的修饰
                const promptData = findPromptData(prompt);
                const allDecorations = promptData ? getPromptDecorations(promptData) : [];
                
                if (allDecorations.length > 0) {
                    // 如果被点击的提示词也有修饰，进入嵌套临时上下文
                    const matchFn = (p, cat) => {
                        if (p.prompt === prompt) return false;
                        const pTags = Array.isArray(p.tags) ? p.tags : [];
                        const catData = allPrompts[cat] || {};
                        const catTags = Array.isArray(catData.tags) ? catData.tags : [];
                        return pTags.some(t => allDecorations.includes(t)) || 
                            catTags.some(t => allDecorations.includes(t));
                    };
                    beginTemporaryContext(matchFn, prompt, `选择 "${promptData.name}" 的修饰词`);
                    return;
                }
                
                // 没有修饰，直接添加到当前层的选择列表
                // 先检查是否已经作为字符串或对象存在
                let index = temporarySelectedPrompts.indexOf(prompt);
                let objIndex = -1;
                for (let i = 0; i < temporarySelectedPrompts.length; i++) {
                    const item = temporarySelectedPrompts[i];
                    if (isDecorationObject(item) && item.text === prompt) {
                        objIndex = i;
                        break;
                    }
                }
                
                if (index === -1 && objIndex === -1) {
                    // 都不存在，添加新的
                    temporarySelectedPrompts.push(prompt);
                } else {
                    // 存在，删除它
                    if (index !== -1) {
                        temporarySelectedPrompts.splice(index, 1);
                    }
                    if (objIndex !== -1) {
                        temporarySelectedPrompts.splice(objIndex, 1);
                    }
                }
                
                updateSelectedTags();
                renderCategories();
                return;
            }

            const promptData = findPromptData(prompt);
            if (!promptData) return;

            const allDecorations = getPromptDecorations(promptData);

            // 情况2：有修饰可用 → 总是进入修饰选择模式（不管有没有被选中）
            if (allDecorations.length > 0) {
                const matchFn = (p, cat) => {
                    if (p.prompt === prompt) return false;
                    const pTags = Array.isArray(p.tags) ? p.tags : [];
                    const catData = allPrompts[cat] || {};
                    const catTags = Array.isArray(catData.tags) ? catData.tags : [];
                    return pTags.some(t => allDecorations.includes(t)) || 
                        catTags.some(t => allDecorations.includes(t));
                };
                const title = isBasePromptSelected(prompt) ? `继续选择 "${promptData.name}" 的修饰词` : `选择 "${promptData.name}" 的修饰词`;
                beginTemporaryContext(matchFn, prompt, title);
                return;
            }

            // 情况3：普通提示词（无装饰）→ 切换选择/删除
            const normalIndex = selectedPrompts.indexOf(prompt);
            if (normalIndex === -1) {
                selectedPrompts.push(prompt);
            } else {
                selectedPrompts.splice(normalIndex, 1);
            }

            updateSelectedTags();
            renderCategories();
        }

        // 从组合字符串中提取基础提示词
        function extractBaseFromCombined(combinedStr, basePrompt) {
            // 或者字符串正好是 basePrompt
            if (combinedStr === basePrompt) {
                return true;
            }
            // 如果字符串不包含 '[' 或 ']'，匹配所有
            if (!combinedStr.includes('[') && !combinedStr.includes(']')) {
                return combinedStr === basePrompt;
            }
            // 如果有 '[' 或 ']'，取最后一个 ']' 后的字符串
            const lastBracketPos = combinedStr.lastIndexOf(']');
            if (lastBracketPos !== -1) {
                const afterLastBracket = combinedStr.substring(lastBracketPos + 1).trim();
                return afterLastBracket === basePrompt;
            }
            return false;
        }

        // 检查装饰对象是否以某个提示词为基础
        function isObjectBaseMatch(obj, basePrompt) {
            if (!isDecorationObject(obj)) return false;
            return obj.text === basePrompt;
        }

        function isBasePromptSelected(prompt) {
            // 检查 prompt 是否作为 base prompt 被选中（包括 decoration 组合）
            if (selectedPrompts.includes(prompt)) return true;
            
            // 检查是否有装饰对象匹配
            for (const p of selectedPrompts) {
                if (isDecorationObject(p) && isObjectBaseMatch(p, prompt)) {
                    return true;
                }
                // 检查字符串组合的字符串是否包含该 basePrompt
                if (typeof p === 'string' && extractBaseFromCombined(p, prompt)) {
                    return true;
                }
            }
            return false;
        }

        function getPromptCombinations(basePrompt) {
            const combinations = [];
            for (const p of selectedPrompts) {
                if (p === basePrompt) {
                    combinations.push(p);
                } else if (isDecorationObject(p) && isObjectBaseMatch(p, basePrompt)) {
                    // 如果是装饰对象，获取它的显示文本
                    combinations.push(getDisplayText(p));
                } else if (typeof p === 'string' && extractBaseFromCombined(p, basePrompt)) {
                    // 如果是组合的字符串，直接使用
                    combinations.push(p);
                }
            }
            return combinations;
        }

        function findPromptData(prompt) {
            for (const [cat, catData] of Object.entries(allPrompts)) {
                const prompts = catData.prompts || [];
                for (const p of prompts) {
                    if (p.prompt === prompt) {
                        return { ...p, category: cat };
                    }
                }
            }
            return null;
        }

        function getPromptDecorations(promptData) {
            // 合并提示词自身的 decorations 和类别继承的 decorations
            const ownDecorations = promptData.decorations || [];
            const catData = allPrompts[promptData.category] || {};
            const catDecorations = catData.decorations || [];
            return [...new Set([...ownDecorations, ...catDecorations])];
        }

        function openDecorationModal(promptData) {
            const decorations = getPromptDecorations(promptData);
            currentDecorationTarget = promptData;
            currentDecorationSelections = [];
            updateDecorationSelectedTags();
            
            // 按类别收集匹配的 decoration prompts
            const categoryMatches = {};
            
            for (const deco of decorations) {
                for (const [cat, catData] of Object.entries(allPrompts)) {
                    const catTags = catData.tags || [];
                    const prompts = catData.prompts || [];
                    const catHasMatch = catTags.includes(deco);
                    
                    for (const p of prompts) {
                        const pTags = p.tags || [];
                        if (p.prompt !== promptData.prompt && (pTags.includes(deco) || catHasMatch)) {
                            if (!categoryMatches[cat]) {
                                categoryMatches[cat] = {
                                    catData: catData,
                                    prompts: []
                                };
                            }
                            // 避免同一提示词在同一类别中重复
                            const alreadyAdded = categoryMatches[cat].prompts.some(
                                existing => existing.id === p.id
                            );
                            if (!alreadyAdded) {
                                categoryMatches[cat].prompts.push({ ...p, category: cat });
                            }
                        }
                    }
                }
            }
            
            document.getElementById('decorationModalTitle').textContent = 
                `Select decoration for "${promptData.name}"`;
            
            const listContainer = document.getElementById('decorationPromptsList');
            const catEntries = Object.entries(categoryMatches);
            
            if (catEntries.length === 0) {
                listContainer.innerHTML = '<div class="no-decorations">No matching decorations found</div>';
            } else {
                listContainer.innerHTML = catEntries.map(([cat, data]) => {
                    const bgImage = data.catData.bg_image || '';
                    return `
                    <div class="category expanded deco-category" data-cat="${cat}" style="margin-bottom: 16px;">
                        ${bgImage ? `<div class="category-background-mask"><div class="category-background" data-bg="${bgImage}" style="background-image: url(/images/${bgImage})"></div></div>` : ''}
                        <div class="category-header">
                            <div class="header-content">

                        </div>
                        <div class="category-content box-mode" style="max-height: none;">
                            ${data.prompts.map(p => `
                                <div class="prompt-item normal-mode" style="cursor: pointer;"
                                     onclick="toggleDecorationSelection('${p.prompt}', '${cat}')"
                                     id="deco-${cat}-${p.id}">
                                    <div class="select-area" style="width: 100%; height: 100%; position: relative;">
                                        <div class="image-layer">
                                            ${p.preview ? `<img src="/images/${p.preview}" alt="${p.name}" loading="lazy" onerror="this.style.display='none'; this.parentElement.querySelector('.no-image') || this.parentElement.insertAdjacentHTML('beforeend', '<div class=\\'no-image\\'>No Image</div>');">` : '<div class="no-image">No Image</div>'}
                                        </div>
                                        <div class="glass-layer"></div>
                                        <div class="text-layer">
                                            <div class="name">${p.name}</div>
                                            <div class="prompt-text">${p.prompt}</div>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    `;
                }).join('');
                
                // 设置装饰模态框中背景图的缩放比例
                listContainer.querySelectorAll('.deco-category').forEach(decoCat => {
                    const bgContainer = decoCat.querySelector('.category-background');
                    if (bgContainer && bgContainer.dataset.bg) {
                        setBackgroundScale(bgContainer, `/images/${bgContainer.dataset.bg}`);

        function toggleDecorationSelection(decoPrompt, decoration) {
            const existingIndex = currentDecorationSelections.findIndex(s => s.decoration === decoration && s.prompt === decoPrompt);
            
            if (existingIndex !== -1) {
                // 取消选择
                currentDecorationSelections.splice(existingIndex, 1);
            } else {
                // 直接添加，允许多选不同 decoration 类型
                currentDecorationSelections.push({ decoration, prompt: decoPrompt });
            }
            
            updateDecorationSelectedTags();
            updateDecorationCardStyles();
        }

        function updateDecorationSelectedTags() {
            const container = document.getElementById('decorationSelectedTags');
            if (currentDecorationSelections.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = currentDecorationSelections.map(s => `
                <span class="tag-chip">
                    ${s.decoration}: ${s.prompt}
                    <span class="tag-remove" onclick="event.stopPropagation(); toggleDecorationSelection('${s.prompt}', '${s.decoration}')">×</span>
                </span>
            `).join('');
        }

        function updateDecorationCardStyles() {
            document.querySelectorAll('#decorationPromptsList .prompt-item').forEach(item => {
                item.classList.remove('selected');
            });
            
            for (const s of currentDecorationSelections) {
                const el = document.getElementById(`deco-${s.decoration}-${findPromptIdByPrompt(s.prompt)}`);
                if (el) {
                    el.classList.add('selected');
                }
            }
        }

        function findPromptIdByPrompt(prompt) {
            for (const [cat, catData] of Object.entries(allPrompts)) {
                const prompts = catData.prompts || [];
                for (const p of prompts) {
                    if (p.prompt === prompt) {
                        return p.id;
                    }
                }
            }
            return '';
        }

        function finishDecorationSelection() {
            if (!currentDecorationTarget) return;
            
            const basePrompt = currentDecorationTarget.prompt;
            const baseId = currentDecorationTarget.id;
            
            // 组合格式: [decoration1] [decoration2] ... originalPrompt
            let combined = basePrompt;
            for (const s of currentDecorationSelections) {
                const decoPrompt = s.prompt.startsWith('[') ? s.prompt : `[${s.prompt}]`;
                combined = `${decoPrompt} ${combined}`;
            }
            
            selectedPrompts.push(combined);
            
            updateSelectedTags();
            closeDecorationModal();
            renderCategories();
        }

        function closeDecorationModal() {
            document.getElementById('decorationModal').classList.remove('visible');
            currentDecorationTarget = null;
            currentDecorationSelections = [];
        }

        // 显示装饰对象的字符串表示
        function getDisplayText(item) {
            if (isDecorationObject(item)) {
                let result = '';
                if (item.decorations && item.decorations.length > 0) {
                    for (const deco of item.decorations) {
                        result += getDisplayText(deco) + ' ';
                    }
                }
                const promptPart = wrapWithBrackets(item.text, item.level);
                const namePart = item.name ? `(${wrapWithBrackets(item.name, item.level)})` : '';
                result += promptPart + namePart;
                return result;
            }
            // 普通字符串，查找对应的name
            const promptData = findPromptData(item);
            if (promptData) {
                return `${item}(${promptData.name})`;
            }
            return item;
        }

        function updateSelectedTags() {
            const list = isTemporaryContext() ? temporarySelectedPrompts : selectedPrompts;
            const count = list.length;
            document.getElementById('selectedCount').textContent = count;

            const container = document.getElementById('selectedTags');

            container.innerHTML = list.map((p, index) => {
                const displayText = getDisplayText(p);
                const escapedDisplayText = displayText.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const removeFunc = isTemporaryContext() ? 
                    `event.stopPropagation(); temporarySelectedPrompts.splice(${index}, 1); updateSelectedTags(); renderCategories();` :
                    `selectedPrompts.splice(${index}, 1); updateSelectedTags(); renderCategories();`;
                return `
                    <span class="tag">
                        ${displayText}
                        <span class="remove" onclick="${removeFunc}">×</span>

        // 截图功能
        async function captureScreenshot(mode) {
            try {
                // 请求后端截图（后端会显示独立的PySide6准备面板）
                const response = await fetch('/capture_screenshot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!response.ok) {
                    throw new Error('Screenshot failed');
                }
                
                const data = await response.json();
                if (data.success && data.image_data) {
                    // 显示预览
                    const previewImg = document.getElementById(`${mode}ImagePreview`);
                    previewImg.src = data.image_data;
                    previewImg.classList.add('visible');
                    
                    // 创建一个File对象，以便后续提交时使用
                    const byteString = atob(data.image_data.split(',')[1]);
                    const mimeString = data.image_data.split(',')[0].split(':')[1].split(';')[0];
                    const ab = new ArrayBuffer(byteString.length);
                    const ia = new Uint8Array(ab);
                    for (let i = 0; i < byteString.length; i++) {
                        ia[i] = byteString.charCodeAt(i);
                    }
                    const blob = new Blob([ab], { type: mimeString });
                    const file = new File([blob], `screenshot_${Date.now()}.png`, { type: mimeString });
                    
                    // 创建 DataTransfer 对象来模拟文件选择
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    document.getElementById(`${mode}Image`).files = dataTransfer.files;
                } else {
                    alert('Screenshot failed: ' + (data.error || 'Unknown error'));
                }
            } catch (e) {
                console.error('Screenshot error:', e);
                alert('Failed to capture screenshot: ' + e.message);
            }
        }

        function removeTag(containerId, index) {
            if (containerId === 'addTagList') {
                addTags.splice(index, 1);
                renderTagList('addTagList', addTags);

                editTags.splice(index, 1);
                renderTagList('editTagList', editTags);
            } else if (containerId === 'addDecorationList') {
                addDecorations.splice(index, 1);
                renderTagList('addDecorationList', addDecorations);
            } else if (containerId === 'editDecorationList') {
                editDecorations.splice(index, 1);
                renderTagList('editDecorationList', editDecorations);
            } else if (containerId === 'editCategoryTagList') {
                editCategoryTags.splice(index, 1);
                renderTagList('editCategoryTagList', editCategoryTags);
            } else if (containerId === 'editCategoryDecorationList') {
                editCategoryDecorations.splice(index, 1);

            }
        }

        async function addPrompt() {

            if (index !== -1) {
                selectedPrompts.splice(index, 1);
                updateSelectedTags();
                renderCategories();
                return;

            // 如果没有直接匹配，尝试匹配装饰对象的显示文本
            for (let i = 0; i < selectedPrompts.length; i++) {
                if (isDecorationObject(selectedPrompts[i]) && getDisplayText(selectedPrompts[i]) === promptText) {
                    selectedPrompts.splice(i, 1);
                    updateSelectedTags();
                    renderCategories();
                    return;
                }
                // 如果是组合的字符串，也尝试匹配
                if (typeof selectedPrompts[i] === 'string' && selectedPrompts[i] === promptText) {
                    selectedPrompts.splice(i, 1);

                    renderCategories();
                    return;
                }
            }

        // 清理所有拖拽样式

        // ==================== 简化版拖拽系统 ====================
        function initDragEvents() {
            clearDragStyles();

            // 1. 提示词拖拽
            console.log('[Drag] initDragEvents: 查找prompt拖拽把手...');
            const promptHandles = document.querySelectorAll('.prompt-item .drag-handle[data-drag-type="prompt"]');
            console.log('[Drag] 找到', promptHandles.length, '个prompt拖拽把手');
            
            promptHandles.forEach(handle => {
                handle.draggable = true;
                handle.style.pointerEvents = 'all';
                handle.style.zIndex = '10000';
                console.log('[Drag] 设置draggable:', handle.dataset.id, handle.dataset.category);
                
                handle.addEventListener('dragstart', (e) => {
                    console.log('[Drag] dragstart 触发:', handle.dataset.id);
                    // 开始拖拽：禁用zoom-view
                    isDragging = true;
                    clearTimeout(zoomTimer);
                    clearTimeout(leaveTimer);
                    if (currentZoomItem) {
                        currentZoomItem.classList.remove('zoom-view');
                        currentZoomItem = null;
                    }
                    
                    // 设置dataTransfer，确保拖拽能正常工作
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', handle.dataset.id);
                    
                    const promptId = handle.dataset.id;
                    const category = handle.dataset.category;
                    
                    dragState.type = 'prompt';
                    dragState.item = promptId;
                    dragState.category = category;
                    console.log('[Drag] dragState 设置:', dragState);
                    
                    const promptItem = handle.closest('.prompt-item');
                    if (promptItem) {
                        dragState.element = promptItem;
                        promptItem.classList.add('dragging');
                        console.log('[Drag] 添加dragging类');
                    }
                });
                
                handle.addEventListener('click', e => {
                    console.log('[Drag] click 触发');
                    e.stopPropagation();
                });
                // 注意：不要阻止mousedown的默认行为，否则会影响dragstart
            });

            // 2. 类别拖拽
            document.querySelectorAll('.category .drag-handle[data-drag-type="category"]').forEach(handle => {
                handle.draggable = true;
                handle.style.pointerEvents = 'all';
                
                handle.addEventListener('dragstart', (e) => {
                    // 开始拖拽：禁用zoom-view
                    isDragging = true;
                    clearTimeout(zoomTimer);
                    clearTimeout(leaveTimer);
                    if (currentZoomItem) {
                        currentZoomItem.classList.remove('zoom-view');
                        currentZoomItem = null;
                    }
                    
                    // 设置dataTransfer，确保拖拽能正常工作
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', handle.dataset.category);
                    
                    const category = handle.dataset.category;
                    if (!category) return;
                    
                    dragState.type = 'category';
                    dragState.item = category;
                    
                    const categoryDiv = document.getElementById(`category-${category}`);
                    if (categoryDiv) {
                        dragState.element = categoryDiv;
                        categoryDiv.classList.add('dragging');
                    }
                });
            });

            // 3. 全局拖拽结束
            document.addEventListener('dragend', () => {
                console.log('[Drag] dragend 触发');
                isDragging = false; // 恢复zoom-view
                clearDragStyles();
                dragState.type = null;
                dragState.item = null;
                dragState.category = null;
                dragState.element = null;
            });

            // 4. 设置拖放目标
            setupDropTargets();
        }

        function setupDropTargets() {
            // 全局管理drag-over状态，防止边界抖动
            let dragOverTimer = null;
            
            // === 类别拖放目标 ===
            document.querySelectorAll('.category').forEach(category => {
                const catHeader = category.querySelector('.category-header');
                if (catHeader) {
                    catHeader.addEventListener('dragover', (e) => {
                        if (dragState.type === 'category' && category.id !== `category-${dragState.item}`) {
                            e.preventDefault();
                            e.stopPropagation();
                            // 防止重复设置
                            if (!category.classList.contains('drag-over')) {
                                clearTimeout(dragOverTimer);
                                dragOverTimer = null;
                                category.classList.add('drag-over');
                            }
                        }
                    });
                    
                    catHeader.addEventListener('dragleave', (e) => {
                        // 延迟移除drag-over，防止边界抖动
                        const rect = catHeader.getBoundingClientRect();
                        const isStillOver = e.clientX >= rect.left && e.clientX <= rect.right &&
                                        e.clientY >= rect.top && e.clientY <= rect.bottom;
                        
                        if (!isStillOver) {
                            dragOverTimer = setTimeout(() => {
                                category.classList.remove('drag-over');
                            }, 50);
                        }
                    });
                    
                    catHeader.addEventListener('drop', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        clearTimeout(dragOverTimer);
                        dragOverTimer = null;
                        category.classList.remove('drag-over');
                        
                        if (dragState.type === 'category') {
                            const targetCategory = category.id.replace('category-', '');
                            if (dragState.item !== targetCategory) {
                                await reorderCategories(dragState.item, targetCategory, 'at');
                            }
                        }
                    });
                }
            });

            // === 添加类别卡片（拖到末尾） ===
            document.querySelectorAll('.add-category-card').forEach(card => {
                card.addEventListener('dragover', (e) => {
                    if (dragState.type === 'category') {
                        e.preventDefault();
                        if (!card.classList.contains('drag-over')) {
                            card.classList.add('drag-over');
                        }
                    }
                });
                
                card.addEventListener('dragleave', () => {
                    card.classList.remove('drag-over');
                });
                
                card.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    card.classList.remove('drag-over');
                    
                    if (dragState.type === 'category') {
                        await reorderCategories(dragState.item, null, 'end');
                    }
                });
            });

            // === 提示词拖放目标 ===
            const promptDropTargets = document.querySelectorAll('.prompt-item:not(.add-prompt-btn)');
            console.log('[Drag] 找到', promptDropTargets.length, '个prompt拖放目标');
            
            promptDropTargets.forEach(item => {
                let itemDragTimer = null;
                
                item.addEventListener('dragover', (e) => {
                    if (dragState.type === 'prompt') {
                        console.log('[Drag] dragover 触发:', item.dataset.id);
                        e.preventDefault();
                        e.stopPropagation();
                        clearTimeout(itemDragTimer);
                        itemDragTimer = null;
                        if (!item.classList.contains('drag-over')) {
                            item.classList.add('drag-over');
                        }
                    }
                });
                
                item.addEventListener('dragleave', (e) => {
                    // 检查鼠标是否真的离开了
                    const rect = item.getBoundingClientRect();
                    const isStillOver = e.clientX >= rect.left && e.clientX <= rect.right &&
                                       e.clientY >= rect.top && e.clientY <= rect.bottom;
                    
                    if (!isStillOver) {
                        itemDragTimer = setTimeout(() => {
                            item.classList.remove('drag-over');
                        }, 50);
                    }
                });
                
                item.addEventListener('drop', async (e) => {
                    console.log('[Drag] drop 触发:', item.dataset.id);
                    e.preventDefault();
                    e.stopPropagation();
                    clearTimeout(itemDragTimer);
                    itemDragTimer = null;
                    item.classList.remove('drag-over');
                    
                    if (dragState.type === 'prompt') {
                        const targetId = item.dataset.id;
                        const targetCategory = item.dataset.category;
                        console.log('[Drag] drop 处理:', dragState.item, '->', targetId, 'cat:', dragState.category, '->', targetCategory);
                        
                        if (targetId && dragState.item !== targetId) {
                            if (dragState.category === targetCategory) {
                                await reorderPrompts(dragState.category, dragState.item, targetId, 'at');
                            } else {
                                await movePromptToCategory(dragState.category, targetCategory, dragState.item, targetId);
                            }
                        }
                    }
                });
            });

            // === 添加提示词按钮（拖到末尾） ===
            document.querySelectorAll('.add-prompt-btn').forEach(btn => {
                btn.addEventListener('dragover', (e) => {
                    if (dragState.type === 'prompt') {
                        e.preventDefault();
                        if (!btn.classList.contains('drag-over')) {
                            btn.classList.add('drag-over');
                        }
                    }
                });
                
                btn.addEventListener('dragleave', () => {
                    btn.classList.remove('drag-over');
                });
                
                btn.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    btn.classList.remove('drag-over');
                    
                    if (dragState.type === 'prompt') {
                        const targetCategory = btn.dataset.category;
                        if (targetCategory) {
                            if (dragState.category === targetCategory) {
                                await reorderPrompts(dragState.category, dragState.item, null, 'end');
                            } else {
                                await movePromptToCategory(dragState.category, targetCategory, dragState.item, null);
                            }
                        }
                    }
                });
            });
        }

            } catch (e) {
                console.error('Failed to reorder prompts', e);
                alert('Failed to reorder prompts: ' + e.message);
            }
        }

        async function movePromptToCategory(fromCategory, toCategory, promptId, insertPosition) {
            try {
                const response = await fetch('/move_prompt_to_category', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        from_category: fromCategory,
                        to_category: toCategory,
                        prompt_id: promptId,
                        insert_position: insertPosition
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.success) {
                    await loadData();
                } else {
                    throw new Error(result.error || 'Unknown error');
                }
            } catch (e) {
                console.error('Failed to move prompt', e);
                alert('Failed to move prompt: ' + e.message);
            }
        }

        // Zoom View - 延迟 0.5s 进入仔细看模式
        let zoomTimer = null;
        let leaveTimer = null;
        let currentZoomItem = null;
        let isDragging = false; // 标记是否正在拖拽
        
        // 计算zoom-view尺寸：按1024*1024像素量等比例缩放
        function setZoomViewSize(promptItem) {
            const img = promptItem.querySelector('.image-layer img');
            if (!img || !img.naturalWidth || !img.naturalHeight) {
                return false;
            }
            const imgW = img.naturalWidth;
            const imgH = img.naturalHeight;
            const targetPixels = 750 * 750;
            const currentPixels = imgW * imgH;
            const scale = Math.sqrt(targetPixels / currentPixels);
            const zoomW = imgW * scale;
            const zoomH = imgH * scale;
            promptItem.style.setProperty('--zoom-width', zoomW + 'px');
            promptItem.style.setProperty('--zoom-height', zoomH + 'px');
            return true;
        }
        
        // 调整zoom-view位置，避免碰到浏览器边框
        function adjustZoomViewPosition(promptItem) {
            const rect = promptItem.getBoundingClientRect();
            const zoomW = parseFloat(getComputedStyle(promptItem).width) || rect.width;
            const zoomH = parseFloat(getComputedStyle(promptItem).height) || rect.height;
            const margin = 20; // 距离浏览器边框的最小间距
            
            let offsetX = 0;
            let offsetY = 0;
            
            // 检查右边缘
            if (rect.left + zoomW > window.innerWidth - margin) {
                offsetX = window.innerWidth - margin - zoomW - rect.left;
            }
            // 检查左边缘
            if (rect.left + offsetX < margin) {
                offsetX = margin - rect.left;
            }
            // 检查下边缘
            if (rect.top + zoomH > window.innerHeight - margin) {
                offsetY = window.innerHeight - margin - zoomH - rect.top;
            }
            // 检查上边缘
            if (rect.top + offsetY < margin) {
                offsetY = margin - rect.top;
            }
            
            if (offsetX !== 0 || offsetY !== 0) {
                promptItem.style.setProperty('--zoom-offset-x', offsetX + 'px');
                promptItem.style.setProperty('--zoom-offset-y', offsetY + 'px');
            } else {
                promptItem.style.removeProperty('--zoom-offset-x');
                promptItem.style.removeProperty('--zoom-offset-y');
            }
        }
        
        document.addEventListener('mouseover', (e) => {
            // 如果正在拖拽，直接跳过
            if (isDragging) {
                return;
            }
            
            const promptItem = e.target.closest('.prompt-item:not(.add-prompt-btn)');
            if (promptItem) {
                // 检查是否有预览图
                const hasPreview = setZoomViewSize(promptItem);
                if (!hasPreview) {
                    return;
                }
                
                // 清除离开计时器
                clearTimeout(leaveTimer);
                leaveTimer = null;
                
                if (currentZoomItem !== promptItem) {
                    if (currentZoomItem) {
                        currentZoomItem.classList.remove('zoom-view');
                    }
                    clearTimeout(zoomTimer);
                    currentZoomItem = promptItem;
                    zoomTimer = setTimeout(() => {
                        if (currentZoomItem === promptItem && !isDragging) {
                            promptItem.classList.add('zoom-view');
                            adjustZoomViewPosition(promptItem);
                        }
                    }, 2000);
                }
            }
        });
        
        document.addEventListener('mouseout', (e) => {
            // 如果正在拖拽，直接跳过
            if (isDragging) {
                return;
            }
            
            const promptItem = e.target.closest('.prompt-item:not(.add-prompt-btn)');
            if (promptItem && currentZoomItem === promptItem) {
                // 检查是否真的离开了wrapper，还是只是在内部元素间移动
                const wrapper = promptItem.closest('.prompt-item-wrapper');
                if (wrapper) {
                    const rect = wrapper.getBoundingClientRect();
                    const isStillOver = e.clientX >= rect.left && e.clientX <= rect.right &&
                                       e.clientY >= rect.top && e.clientY <= rect.bottom;
                    
                    if (isStillOver) {
                        // 还在wrapper内，不做处理
                        return;
                    }
                }
                
                // 延迟一点时间再移除，防止抖动
                clearTimeout(leaveTimer);
                leaveTimer = setTimeout(() => {
                    clearTimeout(zoomTimer);
                    // 先添加zoom-exit类，使用绝对定位回缩，避免影响布局
                    promptItem.classList.remove('zoom-view');
                    promptItem.classList.add('zoom-exit');
                    currentZoomItem = null;
                    
                    // 等待transition动画完成后移除zoom-exit
                    const onTransitionEnd = (e) => {
                        if (e.propertyName === 'width' || e.propertyName === 'height') {
                            promptItem.classList.remove('zoom-exit');
                            promptItem.removeEventListener('transitionend', onTransitionEnd);
                        }
                    };
                    promptItem.addEventListener('transitionend', onTransitionEnd);
                    
                    // 保险：如果transition事件没有触发，300ms后强制移除
                    setTimeout(() => {
                        promptItem.classList.remove('zoom-exit');
                        promptItem.removeEventListener('transitionend', onTransitionEnd);
                    }, 350);
                }, 100);
            }
        });
        
        // 事件委托处理提示词卡片点击
        document.addEventListener('click', (e) => {
            // 处理 drag-handle 点击（拖拽）- 不做任何事
            const dragHandle = e.target.closest('.drag-handle');
            if (dragHandle) {
                e.stopPropagation();
                return;
            }

            // 处理 select-area 点击（选择提示词）
            const selectArea = e.target.closest('.select-area');
            if (selectArea) {
                const promptItem = selectArea.closest('.prompt-item');
                if (promptItem && promptItem.dataset.prompt) {
                    togglePrompt(promptItem.dataset.prompt);
                }
                return;
            }
            
            // 处理 action 按钮点击
            const actionBtn = e.target.closest('.action-btn');
            if (actionBtn) {
                e.stopPropagation();
                const action = actionBtn.dataset.action;
                const id = actionBtn.dataset.id;
                const category = actionBtn.dataset.category;
                
                if (action === 'edit') {
                    openEditModal(id, category);
                } else if (action === 'delete') {
                    deletePrompt(id);
                }
                return;
            }
            
            // 处理添加提示词按钮点击
            const addBtn = e.target.closest('.add-prompt-btn');
            if (addBtn) {
                openAddModal(addBtn.dataset.category);
                return;
            }
        });

        // 展开状态的类别背景图片跟随鼠标移动 + 随机晃动
        let lastMouseX = 0;
        let lastMouseY = 0;
        
        // 平滑随机晃动的状态
        const shakeState = {
            offsetX: 0,
            offsetY: 0,
            targetX: 0,
            targetY: 0,
            lastTime: Date.now()
        };
        
        document.addEventListener('mousemove', (e) => {
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });
        
        // 动画循环 - 结合鼠标移动和平滑随机晃动
        function animateBackground() {
            const now = Date.now();
            const deltaTime = (now - shakeState.lastTime) / 1000;
            shakeState.lastTime = now;
            
            // 更新随机目标位置
            if (Math.random() < 0.02) {
                shakeState.targetX = (Math.random() - 0.5) * 4;
                shakeState.targetY = (Math.random() - 0.5) * 4;
            }
            
            // 平滑过渡到目标位置
            const lerpFactor = 0.05;
            shakeState.offsetX += (shakeState.targetX - shakeState.offsetX) * lerpFactor;
            shakeState.offsetY += (shakeState.targetY - shakeState.offsetY) * lerpFactor;
            
            const bgMasks = document.querySelectorAll('.category-background-mask');
            bgMasks.forEach(mask => {
                const category = mask.closest('.category');
                if (!category) return;
                
                const rect = category.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const deltaX = (lastMouseX - centerX) / rect.width;
                const deltaY = (lastMouseY - centerY) / rect.height;
                
                // 找到内部的背景图元素并设置变换
                const bg = mask.querySelector('.category-background');
                if (!bg) return;
                
                // 计算背景图与mask的尺寸差
                const maskW = mask.offsetWidth;
                const maskH = mask.offsetHeight;
                const bgW = parseFloat(getComputedStyle(bg).width) || maskW * 1.2;
                const bgH = parseFloat(getComputedStyle(bg).height) || maskH * 1.2;
                
                const maxMoveX = Math.max(0, (bgW - maskW) * 0.5);
                const maxMoveY = Math.max(0, (bgH - maskH) * 0.5);
                
                // 鼠标移动系数，降低移动幅度（0.1 = 10%的移动量）
                const mouseSensitivity = 0.05;
                
                // 目标位置（无限制时）
                const targetX = deltaX * maxMoveX * mouseSensitivity + shakeState.offsetX;
                const targetY = deltaY * maxMoveY * mouseSensitivity + shakeState.offsetY;
                
                // 边缘衰减函数：越接近边缘，移动越慢，在边缘处速度降为0
                function applyEdgeDecay(value, maxValue) {
                    if (maxValue <= 0) return 0;
                    const ratio = value / maxValue;
                    const decayedRatio = Math.tanh(ratio);
                    return decayedRatio * maxValue;
                }
                
                const totalX = applyEdgeDecay(targetX, maxMoveX);
                const totalY = applyEdgeDecay(targetY, maxMoveY);
                
                bg.style.setProperty('--bg-x', `${totalX}px`);
                bg.style.setProperty('--bg-y', `${totalY}px`);
            });
            
            requestAnimationFrame(animateBackground);
        }
        
        // 启动动画循环
        requestAnimationFrame(animateBackground);
        
        // 当类别折叠时，重置背景位置
        const observer = new MutationObserver((mutations) => {
            mutations.forEach(mutation => {
                if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                    const category = mutation.target;
                    if (category.classList.contains('category') && !category.classList.contains('expanded')) {
                        category.style.removeProperty('--bg-x');
                        category.style.removeProperty('--bg-y');
                    }
                }
            });
        });
        
        // 观察categories-container的子元素变化，确保新添加的category也被观察
        const containerObserver = new MutationObserver((mutations) => {
            mutations.forEach(mutation => {
                if (mutation.addedNodes) {
                    mutation.addedNodes.forEach(node => {
                        if (node.classList && node.classList.contains('category')) {
                            observer.observe(node, { attributes: true });
                        }
                    });
                }
            });
        });
        
        window.beginTemporaryContext = beginTemporaryContext;
        window.endTemporaryContext = endTemporaryContext;
        window.addBasePromptOnly = addBasePromptOnly;
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            // 监听所有现有类别的class变化
            document.querySelectorAll('.category').forEach(category => {
                observer.observe(category, { attributes: true });
            });
            // 观察容器，监听新添加的category
            const container = document.getElementById('categories');
            if (container) {
                containerObserver.observe(container, { childList: true, subtree: true });
            }
            
            // ResizeObserver 监听背景图mask尺寸变化，重新计算缩放
            const bgResizeObserver = new ResizeObserver((entries) => {
                entries.forEach(entry => {
                    const mask = entry.target;
                    const bg = mask.querySelector('.category-background');
                    if (bg) {
                        const bgImage = bg.style.backgroundImage;
                        const match = bgImage.match(/url\(["']?\/images\/([^"')]+)["']?\)/);
                        if (match && match[1]) {
                            setBackgroundScale(bg, `/images/${match[1]}`);
                        }
                    }
                });
            });
            
            // 监听所有现有的背景图mask
            document.querySelectorAll('.category-background-mask').forEach(mask => {
                bgResizeObserver.observe(mask);
            });
            
            // 通过容器观察器监听新添加的背景图mask
            const bgMaskObserver = new MutationObserver((mutations) => {
                mutations.forEach(mutation => {
                    if (mutation.addedNodes) {
                        mutation.addedNodes.forEach(node => {
                            if (node.classList && node.classList.contains('category-background-mask')) {
                                bgResizeObserver.observe(node);
                            }
                            if (node.querySelectorAll) {
                                node.querySelectorAll('.category-background-mask').forEach(mask => {
                                    bgResizeObserver.observe(mask);
                                });
                            }
                        });
                    }
                });
            });
            
            if (container) {
                bgMaskObserver.observe(container, { childList: true, subtree: true });
            }
        });
    </script>
</body>
